version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # TypeScript 7: @sveltejs/kit@2.70.1 peer-depends on
      # ^5.3.3 || ^6.0.0, so npm ci fails outright on 7.x.
      # Remove once SvelteKit supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
