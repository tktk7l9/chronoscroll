name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      # Real-browser smoke test (serve with production-equivalent CSP headers and verify.
      # This also catches CSP hash drift after a SvelteKit update)
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          node e2e/serve.mjs 5299 &
          sleep 1
          node e2e/smoke.mjs http://localhost:5299
