name: data-refresh

# On the 1st of every month at 21:00 UTC (JST 6:00 on the 2nd), regenerate the data from Wikipedia and open a PR.
# pipeline/.cache is carried over via the Actions cache, so the API is only hit for new links.
# Signals such as page views get stale for cached entries, but the effect on the relative ranking of prominence is minor.
on:
  schedule:
    - cron: '0 21 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-
      - run: npm ci
      - run: npx tsx pipeline/run/build.ts
      - run: npm run coverage
      - run: npm run build
      - name: PR作成（差分がある場合のみ）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="data-refresh-$(date +%Y%m)"
          git checkout -B "$BRANCH"
          git add static/data pipeline/.cache/qids.json pipeline/.cache/sitelinks.json pipeline/.cache/images.json pipeline/.cache/pageviews.json
          # generatedAt in index.json always changes on every build (the app does not read it).
          # Judging by a plain diff would open a PR every month "even though the content is the same",
          # making it impossible to tell the months when data actually grew, so ignore only this value.
          OTHER=$(git diff --cached --name-only | grep -v '^static/data/index\.json$' || true)
          NEW_META=$(git show :static/data/index.json | jq -S 'del(.generatedAt)')
          OLD_META=$(git show HEAD:static/data/index.json | jq -S 'del(.generatedAt)')
          if [ -z "$OTHER" ] && [ "$NEW_META" = "$OLD_META" ]; then
            echo "データに変更なし（generatedAtのみ）"
            exit 0
          fi
          git commit -m "data: 月次データ更新 $(date +%Y-%m)"
          git push -f origin "$BRANCH"
          # Do not create a PR if one already exists. If none exists and creation fails, fail the job (on 2026-09-27,
          # "GitHub Actions is not permitted to create or approve pull requests" was
          # swallowed by `|| echo`, and the job succeeded with no PR)
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            echo "PRは既に存在します"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "data: 月次データ更新 $(date +%Y-%m)" \
              --body "Wikipediaからの自動再生成です。統計（件数・チャンク内訳）をActionsログで確認してからマージしてください。"
          fi
