# The Soviet Union (collection)
# References to existing auto-generated events only (nothing newly written). Bloody Sunday and the October
# Manifesto; the abdication of Nicholas II, the April Theses and the October Revolution; the execution of the
# Romanovs, the attempt on Lenin, Stalin made general secretary and the founding of the Soviet Union; the Kirov
# murder, the Stalin constitution, the purge of Tukhachevsky and the trial of Bukharin; the first Soviet atomic test
# and Stalin's death; Khrushchev's secret speech, Sputnik, Khrushchev as premier and Gagarin; Afghanistan, the
# deaths of Brezhnev, Andropov and Chernenko, and Gorbachev; Chernobyl, Gorbachev in Japan, the August coup, the
# Belovezha Accords and the end of the Soviet Union.
# Checked against en: the April Theses (17 Apr 1917, "April Theses"), Sputnik's radio beeps and the shock in the
# West ("Sputnik 1", "Sputnik crisis") and Chernobyl as the most destructive nuclear disaster ("Chernobyl
# disaster"). Dates before 1918 are the Gregorian dates the articles give next to the Julian ones.
# The execution of the Romanovs (17 Jul 1918) and the deaths of Brezhnev (10 Nov 1982) and Andropov (9 Feb 1984) are
# included with the wording corrected in fixes.yaml (2026-10-13): the family was his wife and five children, and the
# successors took office on 12 Nov 1982 and 13 Feb 1984. Chernobyl's 「ヨーロッパ全域」 is softened to 「ヨーロッパの広い範囲」 in
# content/curated/top50.yaml after en "Chernobyl disaster" ("much of Europe").
# Overlaps: the first atomic test is also in the nuclear weapons collection; the secret speech, Afghanistan,
# Gorbachev's election, the August coup and the end of the Soviet Union in the Cold War collection; Sputnik and
# Gagarin in the space collection; Chernobyl in the nuclear power collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the February Revolution "breaks out" 12 Mar 1917 / the article dates
# it 8-12 Mar; Trotsky expelled 31 Jan 1929 / the article has the year only; Gorbachev made president 15 Mar 1990
# "Lithuania's declaration declared void" and the rehabilitation decree of 13 Aug 1990 / not in the article).
slug: soviet-union
title: ソビエト連邦の興亡
lead: 1905年の血の日曜日事件と十月宣言から、ニコライ2世の退位、レーニンの四月テーゼ、十月革命、ロマノフ家の処刑、レーニンの銃撃、スターリンの書記長選出、ソビエト社会主義共和国連邦の成立、キーロフ暗殺事件、スターリン憲法、トゥハチェフスキーの粛清とモスクワ裁判、初の核実験、スターリンの死、フルシチョフによるスターリン批判、スプートニク1号とガガーリンの宇宙飛行、アフガニスタン侵攻、ブレジネフ・アンドロポフ・チェルネンコの3人の書記長の死去、ゴルバチョフの書記長就任、チェルノブイリ原子力発電所の事故、8月クーデター、独立国家共同体の創立宣言、ソビエト連邦の崩壊まで。革命から崩壊までのソ連の歩みをたどる。
description: 血の日曜日事件と十月革命から、ソビエト連邦の成立、スターリンの大粛清、スプートニク1号、ゴルバチョフの登場、チェルノブイリ、8月クーデター、ソビエト連邦の崩壊まで、ソ連の興亡を年代順にたどる特集。
