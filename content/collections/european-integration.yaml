slug: european-integration
title: ヨーロッパ統合
lead: 1950年のシューマン宣言と欧州石炭鉄鋼共同体、ローマ条約から、3共同体の統合、イギリスなどの加盟とギリシャ、スペイン、ポルトガルへの拡大、マーストリヒト条約と欧州連合の発足、ユーロの導入、2004年の10か国加盟、リスボン条約、ギリシャ支援、ノーベル平和賞、クロアチアの加盟、そしてイギリスの離脱まで。ヨーロッパ統合の70年をたどる。
description: 欧州石炭鉄鋼共同体とローマ条約から、マーストリヒト条約、ユーロの導入、東方への拡大、リスボン条約、イギリスの離脱まで、ヨーロッパ統合の歩みを年代順にたどる特集。
