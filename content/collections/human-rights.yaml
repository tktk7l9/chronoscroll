  # --- The Universal Declaration, the US civil rights movement, apartheid on trial ---
  - id: 1948-07-26-b1080a69 # Truman's executive order against racial discrimination in the armed forces
  - id: 1948-12-10-67c619b3 # The UN adopts the Universal Declaration of Human Rights
  - id: 1955-12-01-7ac50c14 # Rosa Parks and the Montgomery bus boycott
  - id: 1957-09-04-52f09def # Little Rock: the National Guard blocks nine Black students
  - id: 1960-02-01-bde6c0b8 # The Greensboro sit-in
  - id: 1962-08-05-68d9a312 # Nelson Mandela arrested
  - id: 1962-11-06-afb9aa81 # The UN General Assembly condemns apartheid
  - id: 1964-06-12-410108e0 # Mandela and seven others sentenced to life, sent to Robben Island
  - id: 1964-07-02-69b7d9b3 # Johnson signs the Civil Rights Act of 1964
  - id: 1968-04-04-ed055f9c # Martin Luther King Jr. assassinated

  # --- The 1990s: the end of apartheid; leprosy and the Ainu in Japan ---
  - id: 1990-05-17-ae35151b # WHO removes homosexuality from its list of diseases
  - id: 1991-06-17-a6f660bc # The Population Registration Act repealed: apartheid ended in law
  - id: 1994-04-27-62850741 # The first election without racial restrictions
  - id: 1994-05-10-3e3b6610 # Mandela becomes South Africa's first Black president
  - id: 1996-04-01-76f8d3cb # The Leprosy Prevention Act abolished
