# History of the calendar, eras and time (collection)
# References to existing auto-generated events only (nothing newly written).
# Era names (the rescript of one era per reign, Taisho, Showa, the Era Name Act, Heisei, Reiwa), the switch from the
# Tenpo lunisolar calendar to the Gregorian calendar in 1872-1873, standard time (the 1886 ordinance, Japan Standard
# Time from 1888, Central and Western Standard Time, one standard time again in 1937, Samoa crossing the date line),
# summer time in 1948, leap seconds (2009, 2012, 2015) and the holidays (the 1873 holiday decree, the National Holidays
# Act and its changes: National Foundation Day, substitute holidays, the national day of rest, Marine Day, the Happy
# Monday system, Showa Day and Greenery Day, Mountain Day).
# Heisei: the curated top-tier entry for 7 Jan 1989 is used (its wording is corrected in content/curated/top50.yaml:
# Akihito acceded on 7 Jan and the era changed on the 8th, per the article 平成); the long year-page entry of the same
# day and the 8 Jan entry are not.
# Duplicates: the Reiwa announcement (1 Apr 2019) and its start (1 May 2019) each appear twice; the detailed
# announcement entry and the curated top-tier start entry are used.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: New Zealand adopting standard time 2 Nov 1868, the US Standard Time Act
# 19 Mar 1918, the first full cycle of the Gregorian calendar 14 Oct 1982, Marine Day enacted 8 Mar 1995 and the leap
# second of 31 Dec 2005 / not dated in the articles).
slug: calendar
title: 暦と時刻の歴史
lead: 1868年の一世一元の詔と、1872年の改暦の布告で旧暦（天保暦）からグレゴリオ暦に切り替わり明治5年12月が2日で終わった明治の改暦から、日本標準時の制定、大正・昭和への改元、夏時刻法によるサマータイム、国民の祝日に関する法律、建国記念の日、振替休日、元号法、平成への改元、ハッピーマンデー制度、閏秒の挿入、山の日、そして令和の発表と改元まで。サモアが日付変更線をまたいで1日を飛ばした出来事も含めて、暦と時刻と祝日の歩みをたどる。
description: 一世一元の詔と明治の改暦から、日本標準時、夏時刻、国民の祝日に関する法律、元号法、閏秒、令和への改元まで、暦と時刻と祝日の節目を日本と世界の出来事で年代順にたどる特集。
icon: art-reiwa
entries:
