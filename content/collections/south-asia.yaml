# fixes.yaml (2026-10-13): more than 1,500 casualties, and Nanda as acting prime minister (en "Gulzarilal Nanda").
# Overlaps: the Salt March is also in the human rights collection, the nuclear tests of 1974 and of Pakistan in the
# nuclear weapons collection, Bhutto's premiership in the women's rights collection and the Mumbai attacks in the
# terrorism collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the Calcutta session of 28 Dec 1906 / not dated in the articles; the
# Rowlatt Act 21 Mar 1919 "enacted in Britain" / passed in Delhi by the Imperial Legislative Council; Gandhi's
# satyagraha of 6 Apr 1919 / not dated in the articles; the second India-Pakistan war 1 Sep 1965 / the article dates
# the war from August; Manmohan Singh's cabinet 13 May 2004 / he took office on 22 May; the banknote ban 9 Nov 2016
# and the UN population announcement 19 Apr 2023 / not dated in the articles).
slug: south-asia
title: インドと南アジア
lead: 1877年のヴィクトリア女王のインド女帝即位から、ベンガル分割令、インド・ムスリム連盟の創立、アムリットサル事件、インド国民会議の独立宣言、ガンディーの塩の行進、自由インド仮政府、インドとパキスタンの分離独立、ガンディーの暗殺、インド憲法の施行、第1回アジア競技大会、ベンガル語の公用語化を求める運動、初代首相ネルーの死去、バングラデシュの建国宣言と第三次印パ戦争、インドとパキスタンの核実験、インディラ・ガンディーとラジーヴ・ガンディーの暗殺、ボパール化学工場事故、ベーナズィール・ブットーの首相就任と暗殺、ムンバイ同時多発テロまで。インド・パキスタン・バングラデシュの130年余りをたどる。
description: ヴィクトリア女王のインド女帝即位から、ガンディーの塩の行進、インドとパキスタンの分離独立、バングラデシュの建国、印パの核実験、ムンバイ同時多発テロまで、インドと南アジアの歩みを年代順にたどる特集。
