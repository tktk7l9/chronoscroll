# India and South Asia (collection)
# References to existing auto-generated events only (nothing newly written). Queen Victoria as Empress of India, the
# partition of Bengal and the Muslim League; the Amritsar massacre, the Congress's declaration of independence, the
# Salt March and Bose's Free India government; independence and partition, Gandhi's assassination, the constitution
# and the first Asian Games; the Bengali language movement and Nehru's death; Bangladesh's declaration of
# independence and the third India-Pakistan war; India's nuclear tests of 1974 and 1998 and Pakistan's of 1998; the
# assassinations of Indira Gandhi, Rajiv Gandhi and Benazir Bhutto, Bhutto's first premiership, the Bhopal disaster
# and the Mumbai attacks.
