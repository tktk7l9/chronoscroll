# History of breakdancing (collection)
# The auto-generated data has no breakdancing events, so every entry is written here, with ja/en Wikipedia articles
# as sources. Importance is kept at 40-60 so that the entries do not crowd the overview zoom.
# Audited against the topic articles (2026-10-13): 18 entries checked, 15 corrected here, 1 dropped. Each line now
# says only what its sources say, and the article that gives the date was added where the listed ones did not.
# Corrected: Kool Herc's party of 11 Aug 1973, held in the apartment building at 1520 Sedgwick Avenue and credited
# with starting hip hop (en "DJ Kool Herc", "1520 Sedgwick Avenue"; the line called it a block party and dated the
# invention of the breakbeat to that night); the Rock Steady Crew, formed by Jimmy Dee and Jimmy Lee and made famous
# by Flashdance (en "Breakdancing"); "Rapper's Delight", the first commercially successful rap record, number 36 in
# the US (not the first nationwide hip-hop hit, and the spread of breaking it was said to prepare is in no article);
# the 1981 Lincoln Center battle and its press coverage (en "Breakdancing"); Style Wars, a PBS documentary centred
# on graffiti (not a record of the "four elements"); Wild Style, released in Japan in Oct 1983 and followed by the
# Rock Steady Crew's visit (ja ブレイクダンス); Beat Street's influence abroad, as in Germany (en "Beat Street"; the line
# said it decided the worldwide boom); the 1984 Los Angeles closing ceremony, where Lionel Richie sang with
# breakdancers (en "1984 Summer Olympics closing ceremony"; the line called it the first Olympic stage for street
# dance); Japan's 1984 boom, now Kazami Shingo's 「涙のtake a chance」 (the line put youths dancing on the Harajuku
# hokoten, which ja ブレイクダンス doubts); Battle of the Year, without Hanover and the claim of the first framework; the
# UK B-Boy Championships, founded by DJ Hooch in London (en "Hip-hop dance"); Red Bull BC One, without the claim
# that it laid the ground for the Olympics; the 2012 school dance requirement, without 「現代的なリズムのダンス」; the 2018 Youth
# Olympics, the first dancesport at any Olympics; the IOC decision of 7 Dec 2020 (en "Breaking at the 2024 Summer
# Olympics", sources dated that day).
# Dropped: 1975-01-01-bd-uprock 「トップロックとアップロックが型として固まる」 (no article gives a year; en "Uprock" has rocking evolve in
# the late 1960s and calls its origins debated). Because the entries are defined here, a dropped entry leaves the
# timeline too. The lead and description no longer speak of a block party.
slug: breaking
title: ブレイクダンスの歴史
lead: 1973年にブロンクスのパーティーで生まれたダンスが、映画とメディアで世界へ広がり、半世紀後にオリンピックの正式競技になるまで。
description: DJクール・ハークのパーティーからパリ五輪の金メダルまで、ブレイクダンス（ブレイキン）の50年を年代順にたどる特集。
icon: art-collection-breaking
entries:
  # --- Birth: parties in the Bronx ---
  - id: 1973-08-11-bd-kool-herc
    date: "1973-08-11"
    precision: day
    title: "ヒップホップの始まりとされるクール・ハークのパーティー"
    summary: "DJクール・ハークが、ニューヨーク・ブロンクスのセジウィック・アベニュー1520番地のアパートで妹と開いたパーティーでDJを務めた。ヒップホップの始まりとされる催しで、同じレコード2枚で曲の間奏（ブレイク）を引き延ばす彼のDJもこの年に生まれたとされる。ブレイクで踊る若者を、彼はBボーイ・Bガールと呼んだ。"
    category: culture
    region: world
    importance: 58
    svg: art-turntable
    sources:
      - { label: "Wikipedia: クール・ハーク", url: "https://ja.wikipedia.org/wiki/クール・ハーク" }
      - { label: "Wikipedia (英語): DJ Kool Herc", url: "https://en.wikipedia.org/wiki/DJ_Kool_Herc" }
      - { label: "Wikipedia (英語): 1520 Sedgwick Avenue", url: "https://en.wikipedia.org/wiki/1520_Sedgwick_Avenue" }
    relatedIds: ["1977-01-01-bd-rock-steady", "1983-04-15-bd-flashdance", "2024-08-09-bd-paris-gold"]

