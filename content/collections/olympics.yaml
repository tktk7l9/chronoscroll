# History of the Olympic and Paralympic Games (collection)
# References to existing auto-generated events only (nothing newly written).
# Not every Games is listed: the picks are turning points and Japan's path
# (first entry, the forfeited 1940 Games, Tokyo 1964 and 2020).
# Left out on purpose: entries whose dataset date disagrees with the topic article
# (Coubertin's Sorbonne speech was on 25 Nov 1892, not 23 Nov).
slug: olympics
title: オリンピック・パラリンピックの歴史
lead: 1894年の国際オリンピック委員会の設立から、日本が初参加したストックホルム大会、返上された1940年の東京大会、アジア初の1964年東京大会、1年延期された東京2020大会、そして100年ぶりのパリ大会まで。冬季大会とパラリンピック、ボイコットやテロに揺れた大会も含めて、近代五輪の130年をたどる。
description: 国際オリンピック委員会の設立から2024年のパリ大会まで、オリンピックとパラリンピックの転換点を、日本の参加の歩みとともに年代順にたどる特集。
