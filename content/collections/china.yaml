# Modern China (collection)
# References to existing auto-generated events only (nothing newly written). The Boxer war, Puyi's accession, the
# Wuchang uprising, the Republic of China and Puyi's abdication; Yuan Shikai's empire, the May Fourth Movement and
# Sun Yat-sen's death; the Xi'an incident, the Marco Polo Bridge incident and the Chongqing talks; the 228 incident
# in Taiwan and the founding of the People's Republic; Liu Shaoqi as head of state, the first nuclear test, the
# Zhenbao Island clash, the first satellite and the seat at the UN; Nixon in Beijing, the Lin Biao incident,
# normalisation with Japan, the Tiananmen incident of 1976, the arrest of the Gang of Four, the peace treaty with
# Japan and Deng Xiaoping in the United States; the Hong Kong declaration, Tiananmen 1989, Taiwan's first direct
# presidential election and the Hong Kong handover; the Beijing Olympics and the Silk Road Economic Belt.
# The first nuclear test (16 Oct 1964) is included with the wording corrected in fixes.yaml, and the Lin Biao
# incident (13 Sep 1971) and the arrest of the Gang of Four (6 Oct 1976) with the date and wording corrected
# (2026-10-13).
# Overlaps: the first nuclear test is also in the nuclear weapons collection; the Marco Polo Bridge incident is also
# in the Manchurian Incident and Second World War collections; the Zhenbao Island clash and Nixon's visit in the
# Cold War collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date or
# details the articles cannot confirm (dataset vs article: the Nanjing government 18 Apr 1927, the Long March 15 Oct
# 1934 and the civil war 12 Jul 1946 / not dated in the articles; the Cultural Revolution "begins" 10 Nov 1965 / Yao
# Wenyuan's article that day, which the article calls its trigger in the literary world; Mao's death 9 Sep 1976
# "condolences from the Soviet Union and Eastern Europe refused" / not in the article; the Sichuan earthquake 12 May
# 2008 "Xinhua reports about 40,000 dead" / not in the article; the Xi-Ma meeting 7 Nov 2015 / no topic article
# found).
slug: china
title: 中国の近現代
lead: 1900年の義和団の乱での清の宣戦布告から、溥儀の即位、武昌新軍の蜂起、中華民国の成立と清の滅亡、袁世凱の帝政、五・四運動、孫文の死去、西安事件、盧溝橋事件、蔣介石と毛沢東の重慶交渉、台湾の二・二八事件、中華人民共和国の成立、劉少奇の国家主席選出、初の原爆実験、珍宝島事件、東方紅1号の打ち上げ、中華人民共和国の国連加盟、ニクソン大統領の訪中、林彪事件、日中国交正常化、四五天安門事件、四人組の逮捕、日中平和友好条約、鄧小平の訪米、香港返還の合意、天安門事件、台湾初の総統直接選挙、香港返還、北京オリンピック、シルクロード経済帯構想の発表まで。清朝末期から現代までの中国と台湾の110年余りをたどる。
description: 義和団の乱と辛亥革命から、中華人民共和国の成立、日中国交正常化、天安門事件、香港返還、北京オリンピックまで、中国の近現代を年代順にたどる特集。
