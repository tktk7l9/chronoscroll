# Personal computers and smartphones (collection)
# References to existing auto-generated events only (nothing newly written). The founding of Microsoft and Apple,
# NEC's PC-8001, the IBM PC, the Macintosh and Windows 1.0; Linux, Windows 95 in Japan, Apple's purchase of NeXT and
# the iMac; i-mode, the iPhone from its announcement to its launch in the US and Japan, Android 1.0 and Windows 7;
# the end of Windows XP, Windows 10 and Windows 11.
# Checked against en: the first public release of Linux (5 Oct 1991, "Linux kernel").
# Overlaps: i-mode and the announcement of the iPhone are also in the telecommunications and broadcasting
# collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the PC-9801 13 Oct 1982 / October 1982 only; Mac OS X 10.0 24 Mar
# 2001 "10.1 on 25 Sep" / the 10.1 date is not in the articles; Windows XP 25 Oct 2001 "retail on 16 Nov" / neither
# date is in the ja article; Steve Jobs's death 5 Oct 2011 "respiratory arrest, surrounded by his family at home" /
# the article has pancreatic cancer and Palo Alto only).
slug: pc-smartphone
title: パソコンとスマートフォン
lead: 1975年のマイクロソフト設立と1976年のアップルコンピュータ設立から、NECのPC-8001、IBM PC、Macintosh、Windows 1.0、Linuxの公開、Windows 95日本語版の発売、AppleによるNeXTの買収、iMac、iモードの開始、初代iPhoneの発表と発売、iPhone 3Gの日本発売、Android 1.0、Windows 7、Windows XPのサポート終了、Windows 10とWindows 11の提供開始まで。パソコンとスマートフォンが暮らしに入ってきた50年近くをたどる。
description: マイクロソフトとアップルの設立から、PC-8001、IBM PC、Macintosh、Windows 95、iモード、iPhone、Android、Windows 11まで、パソコンとスマートフォンの歩みを年代順にたどる特集。
