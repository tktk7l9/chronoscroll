# History of education and schools (collection)
# References to existing auto-generated events only (nothing newly written).
# The Meiji school system (the Ministry of Education, the Gakusei of 1872, the first elementary school and
# kindergarten, the University of Tokyo, the Education Order, the Imperial University Order, the school orders of
# 1886, the Imperial Rescript on Education, six years of compulsory schooling, the first women at an imperial
# university, the University Order and the first private universities), the war (the student mobilisation rally,
# Tsushima Maru), the postwar reform (UNESCO, the Fundamental Law of Education, the 6-3-3 system, the teachers'
# union, the rescript annulled, the new universities and junior colleges), the textbook suits and the campus
# struggle, Tsukuba, and the national examinations from the 1979 joint first-stage test to the 2021 common test.
# Helen Keller's first lesson and Sesame Street are the two entries from outside Japan's school system.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: compulsory education in Britain 29 Nov 1870, Japan's first doctorates
# 7 May 1888, national textbooks 13 Apr 1903, Yasui Kono's doctorate 20 Apr 1927, the blacked-out textbooks
# 20 Sep 1945, Nanbara's remark on women 5 Feb 1946, school lunches resumed 20 Jan 1947 and rice lunches Apr 1976,
# the new high schools 1 Apr 1948, the nationwide achievement test 26 Oct 1961, the Provisional Council on
# Education 21 Aug 1984, the 1990 curriculum on the flag and anthem 1 Apr 1990, the high-school tuition law
# 27 Nov 2013, the Gakusei 150th-anniversary ceremony 5 Sep 2022 and the digital textbook law 10 Jun 2026 / the
# articles give the year or the month only or do not mention it; Montessori's first Casa dei Bambini 6 Jan 1907 /
# Jan 1907; the Board of Education Law passed 5 Jul 1948 / promulgated 15 Jul 1948; the full five-day week and
# "yutori" from 1 Apr 2002 / the article has the first Saturday off on 6 Apr 2002).
slug: education
title: 教育と学校の歴史
lead: 1871年の文部省の設置と1872年の学制発布、日本初の小学校と幼稚園、東京大学の設立から、教育令と帝国大学令、教育勅語、義務教育の6年化、帝国大学初の女子学生、大学令による私立大学の認可、学徒出陣の壮行会、教育基本法と学校教育法による六三三制、新制大学の発足、家永教科書裁判、東大安田講堂事件、共通一次試験とセンター試験、学校週5日制、改正教育基本法、全国学力調査、大学入学共通テストまで。アン・サリヴァンによるヘレン・ケラーの教育の開始、ユネスコ憲章の採択、『セサミストリート』の放送開始も含めて、学校と教育制度の移り変わりをたどる。
description: 学制の発布と日本初の小学校から、教育勅語、六三三制と新制大学、共通一次試験とセンター試験、大学入学共通テストまで、教育と学校制度の節目を日本と世界の出来事で年代順にたどる特集。
icon: art-kenpou
