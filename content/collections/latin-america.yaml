# Latin America and the Caribbean (collection)
# References to existing auto-generated events only (nothing newly written). Cuba's first war of independence, Díaz
# in Mexico and the end of slavery in Brazil; the Maine in Havana, Cuban and Panamanian independence, the Mexican
# Revolution, Machu Picchu and the Panama Canal; Trotsky in Mexico and the oil nationalisation; Castro's landing,
# the Chilean earthquake of 1960, Jamaican independence and the missile crisis; Allende and the Chilean coup; the
# Falklands, Grenada, the fall of Stroessner and the invasion of Panama; Fujimori, the Earth Summit, Escobar and the
# return of the canal; the earthquakes in Haiti and Chile, Rousseff, Chávez's death and Pope Francis; Obama in Cuba,
# Santos's Nobel Peace Prize and the attack in Brasília.
# Checked against en: Trotsky's arrival in Mexico (9 Jan 1937, "Leon Trotsky"), Kennedy's blockade (22 Oct 1962,
# "Cuban Missile Crisis") and the attack in Brasília (8 Jan 2023, "8 January Brasília attacks"). Coolidge as the
# sitting president who visited Cuba in 1928 follows 「バラク・オバマ」 (a visit in 1928) and 「カルビン・クーリッジ」 (in office
# 1923-1929).
# Overlaps: the end of slavery in Brazil is also in the human rights collection, Machu Picchu in the exploration and
# archaeology collections, the Panama Canal's opening and return in the ships collection, the Chilean earthquake of
# 1960 in the disaster collection, the missile crisis in the nuclear weapons collection, the Earth Summit in the
# environment collection and Pope Francis in the papacy collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date or
# details the articles cannot confirm (dataset vs article: the Cuban Revolution 1 Jan 1959 "Batista flees to the
# United States" / he fled to the Dominican Republic; the Brazilian coup 30 Mar 1964 / 31 Mar - 1 Apr (en); the
# Managua earthquake 22 Dec 1972 / 23 Dec (en); the Argentine coup 24 Mar 1976 "bloodless" / not in the articles;
# the Mexico City earthquake 19 Sep 1985 "M8.1, more than 9,000 dead" / Mw 8.0, no toll in the article; the Lima
# hostage crisis 22 Apr 1997 "all hostages freed" / 71 of the 72 hostages rescued, one died; Pinochet's arrest 16
# Oct 1998 / October 1998 only; the US-Cuba announcement 17 Dec 2014 "at the same time" / not in the articles; the
# Rio Olympics 5 Aug 2016 "a record 206 nations" / the record is not in the articles; Moïse's assassination 7 Jul
# 2021 "4 shot dead and 2 detained" / the 4 killed were announced, the arrests came on 8 Jul).
slug: latin-america
title: 中南米とカリブ海
lead: 1868年の第一次キューバ独立戦争から、メキシコのディアス大統領の就任、ブラジルの奴隷制廃止、ハバナ湾での戦艦メインの爆発、キューバとパナマの独立、メキシコ革命、マチュ・ピチュ遺跡の発見、パナマ運河の開通、トロツキーのメキシコ到着、メキシコの石油国有化、カストロらのキューバ上陸、チリ地震、ジャマイカの独立、キューバ危機、アジェンデのチリ大統領就任とチリ・クーデター、フォークランド紛争、グレナダ侵攻、ストロエスネル大統領の失脚、パナマ侵攻、フジモリのペルー大統領就任、地球サミット、パブロ・エスコバルの射殺、パナマ運河の返還、ハイチ地震と2010年のチリ地震、ルセフ大統領の就任、チャベス大統領の死去、教皇フランシスコの選出、オバマ大統領のキューバ訪問、サントス大統領のノーベル平和賞、ブラジリアの国民議会などへの襲撃まで。メキシコからカリブ海、南米までの150年余りをたどる。
description: 第一次キューバ独立戦争から、メキシコ革命、パナマ運河、カストロらのキューバ上陸とキューバ危機、チリ・クーデター、フォークランド紛争、パナマ運河の返還、オバマ大統領のキューバ訪問まで、中南米とカリブ海の歩みを年代順にたどる特集。
