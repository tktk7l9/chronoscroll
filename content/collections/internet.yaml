# History of the Internet (collection)
# References to existing auto-generated events only (nothing newly written). ARPANET's first message and the switch
# to TCP/IP; the World Wide Web opened to outsiders; Amazon, Google, i-mode, 2channel and Wikipedia in English and
# Japanese; the iTunes Music Store, Facebook, YouTube, Twitter and Bitcoin; the Winny ruling, WikiLeaks and the
# left-pad incident; Trump banned from Twitter, Bitcoin as legal tender in El Salvador, Facebook renamed Meta, the
# end of Internet Explorer and Musk's purchase of Twitter.
# Checked against en: the switch to TCP/IP (1 Jan 1983, "ARPANET"), Facebook's launch (4 Feb 2004, "Facebook"),
# Twitter's public launch (15 Jul 2006, "Twitter") and the left-pad incident (22 Mar 2016, "Npm left-pad incident").
# The opening of the World Wide Web (6 Aug 1991, in tier2.yaml) and YouTube's domain (14 Feb 2005, in the AI and
# computing collection) are included with the wording corrected (2026-10-13).
# Overlaps: ARPANET's first message, YouTube, Twitter, Bitcoin and Meta are also in the AI and computing collection;
# the World Wide Web in the telecommunications collection; i-mode in the PC and smartphone and the
# telecommunications collections; the iTunes Music Store in the music collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date or
# details the articles cannot confirm (dataset vs article: ARPANET's first message 29 Oct 1969 "from UCLA to
# Stanford University" / to the Stanford Research Institute (the AI and computing entry for that day is used
# instead); the first domain name symbolics.com 15 Mar 1985 / the first .com domain (en); Cadabra founded 5 Jul 1994
# / the ja article has 5 Jul 1993; the PC-VAN virus 13 Sep 1988, the ITU's two billion users 26 Jan 2011 and the AWS
# outage 20 Oct 2025 / not dated in the articles; the Mt. Gox halt 25 Feb 2014 / the article has trading halted on
# the 24th and the announcement on the 25th; Snowden's asylum 1 Aug 2013 / Obama's remark of the 6th and the
# cancelled summit are not in the article; Assange freed 26 Jun 2024 "after 14 years" / the article has some 12
# years).
slug: internet
title: インターネットの歴史
lead: 1969年のARPANETによる最初のメッセージ送信から、ARPANETのIPへの切り替え、World Wide Webの公開、Amazon.comのサービス開始、Googleの設立、iモードの開始、2ちゃんねるの開設、英語版と日本語版のウィキペディアの開設、iTunes Music Storeの開始、Facebookの開設、YouTubeのドメインの有効化、Twitterの一般公開、ビットコインの最初のブロック、Winny開発者の逆転無罪判決、ウィキリークスによる外交電文の暴露、npm left-pad削除事件、トランプ大統領のTwitterアカウントの永久停止、エルサルバドルのビットコイン導入、FacebookのMetaへの社名変更、Internet Explorerのサポート終了、イーロン・マスクによるTwitter買収まで。インターネットの50年余りをたどる。
description: ARPANETの最初の通信から、Google、iモード、ウィキペディア、Facebook、Twitter、ビットコイン、イーロン・マスクによるTwitter買収まで、インターネットの歩みを年代順にたどる特集。
icon: art-www
