# The Manchurian Incident and the February 26 Incident (collection)
# References to existing auto-generated events only (nothing newly written). Kataoka's slip and the financial crisis
# of 1927, the Shandong expedition, the Jinan incident and the killing of Zhang Zuolin; the fall of the Tanaka
# cabinet, the London naval conference and the shooting of Hamaguchi; the Liutiao Lake incident, the Korea Army
# crossing the border on its own authority, the October incident and the Inukai cabinet; the Shanghai incident and
# its truce, the League of Blood killings, Manchukuo and the May 15 incident; the Lytton report, Rehe, the League of
# Nations vote and Japan's withdrawal, the Tanggu truce and Puyi made emperor; the attack on the emperor-organ
# theory and the statement on the national polity, the killing of Nagata, Japan's exit from the London conference,
# the February 26 incident, the Anti-Comintern Pact and the Marco Polo Bridge incident.
# The fifteen years of war that followed the Liutiao Lake incident are checked against the ja article on the Fifteen
# Years' War.
# Overlaps: Kataoka's slip is also in the finance collection, the attack on the emperor-organ theory in the
# constitution collection and the Marco Polo Bridge incident in the World War II collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the punishments over Zhang Zuolin's killing "and then" the Emperor's
# rebuke 1 Jul 1929 / the rebuke came before the punishments were announced; the London Naval Treaty "signed by the
# US, Britain and Japan" 22 Apr 1930 / not in the article; the March incident "discovered" 20 Mar 1931 / the coup
# was planned for that day and abandoned).
slug: manchurian-incident
title: 満州事変と二・二六事件
lead: 1927年の片岡直温蔵相の失言による昭和金融恐慌から、山東出兵と済南事件、張作霖爆殺事件、濱口首相の狙撃、柳条湖事件と満州事変、十月事件、第一次上海事変、血盟団事件、満洲国の建国宣言、五・一五事件、リットン報告書、国際連盟での撤退勧告の可決と連盟脱退、塘沽協定、天皇機関説への糾弾と国体明徴声明、相沢事件、ロンドン海軍軍縮会議からの脱退、二・二六事件、日独防共協定、1937年の盧溝橋事件まで。昭和の初めの10年に、日本が日中戦争へ向かった歩みをたどる。
description: 柳条湖事件と満州事変から、満洲国の建国、五・一五事件、国際連盟脱退、二・二六事件、盧溝橋事件まで、昭和の初めの10年を年代順にたどる特集。
icon: art-manchurian-incident
