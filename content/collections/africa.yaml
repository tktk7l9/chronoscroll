# Africa from colonial rule to the African Union (collection)
# Existing events, plus two newly written entries the year pages lack: Ghana's independence and the OAU.
# Stanley and Livingstone, the Zulu War, Adwa, the Second Boer War and Italy's invasion of Ethiopia; the independence
# wave of 1957-1964; the Congo crisis, Biafra, Amin, Zaire, Soweto, Zimbabwe; Mandela's release and presidency; Eritrea,
# Mogadishu, Rwanda, the African Union, South Sudan, the Ebola emergency and TICAD IV. Checked 2026-11-02.
# Corrected in fixes.yaml: the Amin coup, Mandela's release, Namibia, Rwanda.
# Overlaps: Mandela's election and presidency are in human-rights; the Ebola emergency is in medicine.
# Left out on purpose (dataset vs article): Malan as prime minister 28 May 1948 / en 4 June 1948; Libya "independent
# from Italy" / the article gives Italy and France; Senegal 4 Apr 1960 / independent then as the Mali Federation;
# Eritrea's independence "recognised by the UN" 24 May 1993 / the article has recognition then, UN membership on the 28th;
# the Brussels Geographic Conference 12 Sep 1876 and the Fashoda incident 19 Sep 1898 / not dated in the articles;
# the Berlin Conference closing line / the claims about the Congo and Nigeria were not confirmed.
slug: africa
title: アフリカの独立と現代
lead: スタンリーとリヴィングストンの出会い、ズールー戦争、アドワの戦いから、1957年のガーナ独立と1960年の「アフリカの年」、アフリカ統一機構の設立、コンゴ動乱、アルジェリアの独立、ビアフラ戦争、ソウェト蜂起、ジンバブエの独立、マンデラの釈放と大統領就任、ルワンダ虐殺、アフリカ連合の発足、南スーダンの独立まで。植民地支配から現代までのアフリカをたどる。
description: ズールー戦争とアドワの戦いから、ガーナ独立、アフリカの年、コンゴ動乱、マンデラの釈放、ルワンダ虐殺、アフリカ連合の発足まで、アフリカの近現代を年代順にたどる特集。
