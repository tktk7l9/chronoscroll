# The popes (collection)
# References to existing auto-generated events only (nothing newly written). The First Vatican Council, papal
# infallibility and the suspension of the council; the elections of Leo XIII, Pius X, Pius XI, Pius XII and John
# XXIII and Leo XIII's Aeterni Patris; the Lateran Treaty and the Reichskonkordat; John Paul II's visit to Japan,
# the attempt on his life, the acknowledgement of the Galileo trial's error, relations with Israel and his death;
# Benedict XVI's election, resignation, death and funeral; the conclaves of 2013 and 2025, Francis's election, his
# visits to Myanmar and Japan and his death; Leo XIV's election, his first journey abroad (Turkey) and his
# encyclical on artificial intelligence.
# Checked against en: Pastor aeternus (18 Jul 1870), the suspension of the council (20 Oct 1870, "First Vatican
# Council"), Aeterni Patris (4 Aug 1879), the signatories of the Reichskonkordat, Galileo (31 Oct 1992, "Galileo
# Galilei"), relations with Israel (15 Jun 1994, "Holy See–Israel relations"), Myanmar (27 Nov 2017, "List of
# pastoral trips made by Pope Francis"), Turkey (27-30 Nov 2025, "2025 visit by Pope Leo XIV to Turkey and Lebanon")
# and Magnifica humanitas (25 May 2026). The two-thirds majority of 2025 is the rule given in the ja article on the
# conclave.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the capture of Rome 20 Sep 1870 "Italy reaches roughly its present
# territory" / not in the articles; Mit brennender Sorge 14 Mar 1937 "condemns discrimination against Jews" / the
# articles describe a condemnation of the deification of race, people and state; the recognition of Franco 27 Aug
# 1937, relations with Japan 23 Mar 1942 and the Galileo statement of 9 May 1983 / not dated in the articles; John
# Paul II in Britain 28 May 1982 "after 450 years" / 448 years; Francis and Kirill 12 Feb 2016 "the first meeting in
# about 1,000 years" / the first meeting ever between a pope and a patriarch of Moscow; the messages at Nagasaki and
# Hiroshima 24 Nov 2019 / the quoted sentence is not in the article; Kishida's audience 4 May 2022, Leo XIV and
# Kirill's envoy 26 Jul 2025 and Leo XIV's warning of 14 Apr 2026 / not in the articles; Kikuchi made a cardinal 7
# Oct 2024 / announced 6 Oct; the funeral of Francis 26 Apr 2025 / Iwaya's attendance is not in the articles; Leo
# XIV's inauguration Mass 18 May 2025 / the place and the participants of the Zelensky-Vance meeting are not in the
# articles).
slug: papacy
title: ローマ教皇
lead: 1869年の第1バチカン公会議と教皇不可謬説の宣言から、レオ13世、ピウス10世、ピウス11世、ピウス12世、ヨハネ23世の選出、ラテラノ条約とライヒスコンコルダート、ヨハネ・パウロ2世の来日と暗殺未遂事件、ガリレオ裁判の誤りの承認、イスラエルとの国交樹立、ベネディクト16世の選出と辞任、フランシスコの選出と38年ぶりの来日、2025年のコンクラーベとレオ14世の選出まで。レオ14世のトルコ訪問と人工知能をテーマにした回勅も含めて、ローマ教皇とバチカンの150年余りをたどる。
description: 第1バチカン公会議から、ラテラノ条約、ヨハネ・パウロ2世の来日、ガリレオの名誉回復、ベネディクト16世の辞任、フランシスコの選出と来日、レオ14世の選出まで、ローマ教皇の歩みを年代順にたどる特集。
