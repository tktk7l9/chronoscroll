# World War II (collection)
# References to existing auto-generated events only (nothing newly written). The Marco Polo Bridge incident and the
# Nazi-Soviet pact; the invasion of Poland, the British and French declarations of war, the Soviet invasion of Poland
# and the Winter War; Denmark and Norway, the western offensive, Dunkirk, the armistice with France and the Battle of
# Britain; Japan's moves into Indochina, the Tripartite Pact, the Soviet-Japanese neutrality pact, Barbarossa and the
# Hull note; Pearl Harbor, the sinking of Prince of Wales and Repulse, Hong Kong, Singapore, Midway and Guadalcanal;
# Stalingrad, Yamamoto's death, Italy's surrender and the Tehran conference; Normandy, Saipan, the liberation of Paris
# and the first B-29 raid on Tokyo; the liberation of Auschwitz, Yalta, the Tokyo air raid, Okinawa, the battleship
# Yamato, Hitler's death and Germany's surrender; the Potsdam Declaration, Hiroshima and Nagasaki, the Soviet entry
# into the war against Japan, the Emperor's broadcast and the surrender on the Missouri.
# Australia's declaration of war on 3 Sep 1939 is checked against en "Declarations of war during World War II" (the ja
# articles name Britain and France only).
# Overlaps: Hiroshima and Nagasaki are also in the nuclear weapons collection; the start of the Battle of Okinawa is
# also in the Okinawa collection.
# Germany's ratification of the surrender in Berlin (8 May 1945) is left out next to the signing at Reims the day
# before; Midway appears twice and the entry dated by Japanese time (5 Jun 1942) is used.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the Atlantic Charter "signed" 12 Aug 1941 / agreed at the meeting of
# 9-12 Aug and published 14 Aug as a joint declaration; the Wannsee conference "decided" to kill Europe's Jews 20 Jan
# 1942 / the article says the officials discussed the deportation and killing; Midway 4 Jun 1942 / the article dates
# the battle 5-7 Jun (Japanese time); the encirclement at Stalingrad 22 Nov 1942 / not dated in the article; Attu "the
# navy's garrison" wiped out 29 May 1943 / the garrison was army under Colonel Yamasaki; the banzai charge on Saipan 7
# Jul 1944 / not dated; the kamikaze units "formed" 19 Oct 1944 / formed on 20 Oct (19 Oct was the meeting); Leyte
# Gulf "begins" 23 Oct 1944 / the article dates the battle 20-25 Oct; the landing on Iwo Jima 16 and 18 Feb 1945 / the
# landing was on 19 Feb).
slug: ww2
title: 第二次世界大戦
lead: 1937年の盧溝橋事件と1939年の独ソ不可侵条約、ドイツのポーランド侵攻から、イギリス・フランスの対独宣戦、ダンケルクの戦いとバトル・オブ・ブリテン、日独伊三国同盟、独ソ戦、真珠湾攻撃と太平洋戦争、ミッドウェー海戦、スターリングラード攻防戦、イタリアの降伏、ノルマンディー上陸作戦、東京大空襲と沖縄戦、ヒトラーの自殺とドイツの降伏、広島・長崎への原子爆弾投下とソ連の対日参戦、玉音放送と降伏文書の調印まで。ヤルタ会談やアウシュヴィッツ強制収容所の解放も含めて、第二次世界大戦の歩みをたどる。
description: 盧溝橋事件とドイツのポーランド侵攻から、真珠湾攻撃、スターリングラード攻防戦、ノルマンディー上陸作戦、広島・長崎への原子爆弾投下、玉音放送と降伏文書の調印まで、第二次世界大戦を日本と世界の出来事で年代順にたどる特集。
