# Great discoveries in science (collection)
# References to existing auto-generated events only (nothing newly written).
# Physics, chemistry, astronomy and the life sciences: from helium in the solar spectrum, the periodic table and
# radium through quantum theory and relativity to exoplanets, the human genome, the Higgs boson, gravitational waves
# and the first image of a black hole, with the Japanese laureates of the Nobel Prizes in physics and chemistry.
# Medical discoveries (X-rays, penicillin, the DNA double helix, iPS cells) stay in the medicine collection,
# Manabe's climate model in the environment collection and the 2024 AI physics prize in the AI collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or that the articles
# cannot confirm (dataset vs article: Ramsay isolates helium 26 May 1895 / 26 Mar 1895; Tomonaga's Nobel Prize
# "decided" 2 Oct 1965 / the article gives only autumn 1965; the Schrodinger equation "established" 3 Sep 1926 /
# the articles give only 1926 for his series of papers).
slug: science
title: 科学の大発見の歴史
lead: 1869年のメンデレーエフの周期表、キュリー夫妻のラジウム、プランクの量子仮説とアインシュタインの相対性理論から、冥王星の発見、超新星1987Aのニュートリノ、初めての太陽系外惑星、クローン羊ドリー、ヒトゲノムの解読、ヒッグス粒子、重力波、ブラックホールの撮影まで。湯川秀樹から北川進までの日本の研究者のノーベル物理学賞・化学賞と、113番元素の命名権の獲得も含めて、物理・化学・生命科学の大発見をたどる。
description: メンデレーエフの周期表からヒッグス粒子、重力波、ブラックホールの撮影まで、物理・化学・生命科学の大発見と日本の研究者のノーベル賞を年代順にたどる特集。
icon: art-radium-discovery
entries:
