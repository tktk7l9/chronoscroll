# History of the motor car and the road (collection)
# References to existing auto-generated events only (nothing newly written).
# Cars (Benz, Ford and the Model T, Japan's carmakers, the Corolla, the hybrid Prius, self-driving cars), roads
# (Japan's expressways and bridges, America's interstates) and the rules for drivers (beginner marks, seat belts,
# cognitive tests for older drivers), with the falling number of road deaths.
# Railways and aviation have their own collections.
# Duplicates: for the Tomei Expressway the first opening of 25 Apr 1968 is used (see below).
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: Daimler "obtains the patent" for his motorcycle on 29 Aug 1885 / he applied that day, the patent
# was granted in Aug 1886; Toyota Motor founded 27 Aug 1937 / 28 Aug 1937; Japan's first automatic traffic light at
# Hibiya 1 Nov 1930 / 23 Mar 1930; Japan's first bus service in Kyoto on 20 Sep 1903 / a Hiroshima service from
# Jan 1903 is considered the first; the Tomei Expressway "fully opened 21 Dec 1971" / fully open on 26 May 1969;
# the 2022 road-death figure credited to the Tokyo police (警視庁) instead of the National Police Agency (警察庁)).
slug: automobile
title: 自動車と道路の歴史
lead: 1886年のベンツのガソリン自動車の特許、フォードの最初の自動車とモデルTから、日産の前身と本田技研工業の設立、首都高速道路と名神・東名高速道路の開通、カローラとプリウス、マツダのル・マン優勝、そしてレベル3・レベル4の自動運転まで。初心者マークの制定やシートベルトの着用義務化、高齢運転者の認知機能検査、交通事故死者数の減少も含めて、車と道と交通のルールの移り変わりをたどる。
description: ベンツの特許とフォード・モデルTから、高速道路網の整備、ハイブリッド車、自動運転まで、自動車と道路の転換点を日本と世界の出来事で年代順にたどる特集。
icon: art-early-car
entries:
