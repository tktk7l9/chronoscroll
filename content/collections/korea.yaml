# The Korean Peninsula (collection)
# References to existing auto-generated events only (nothing newly written). The Ganghwa Island incident, the
# Japan-Korea treaty of 1876 and the Imo and Gapsin incidents; the Hague envoys, the killing of Ito Hirobumi, the
# annexation treaty and the March First Movement; the founding of South and North Korea and the Korean War from the
# invasion, the fall of Seoul, Incheon and the Chinese attack to the armistice; the April Revolution, the May 16
# coup, the 1965 treaty with Japan, North Korea's constitution of 1972, the Mun Se-gwang incident, Park Chung-hee's
# assassination and the December 12 coup; Gwangju, Korean Air 007 and 858, the June 29 declaration and the Seoul
# Olympics; both Koreas joining the UN, the death of Kim Il-sung, Kim Dae-jung's inauguration, the first
# inter-Korean summit, Koizumi in Pyongyang, the first nuclear test, the second inter-Korean summit, the Cheonan,
# the shelling of Yeonpyeong and the death of Kim Jong-il; Park Geun-hye's inauguration and impeachment, the Sewol,
# the Panmunjom declaration and the Singapore summit; the martial law of 2024 and Yoon Suk-yeol's impeachment.
# Checked against en: the opening of the Second Hague Peace Conference (15 Jun 1907, "Hague Conventions of 1899 and
# 1907") and the Baltic states joining the UN on the same day as the two Koreas (17 Sep 1991, "Member states of the
# United Nations").
# The treaty of 1876 (26 Feb) and North Korea's constitution (27 Dec 1972) are included with the date corrected in
# fixes.yaml, and the Chinese attack of 25 Oct 1950, the treaty of 1965, the summit of 2000 and the shelling of
# Yeonpyeong with the wording corrected (2026-10-13).
# Overlaps: the Ganghwa Island incident and the treaty of 1876 are also in the Meiji Restoration collection, the
# outbreak of the Korean War and the armistice in the Cold War collection, the nuclear test in the nuclear weapons
# collection and the Sewol in the ships collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the Donghak uprising 29 Mar 1894 / not dated in the article).
slug: korea
title: 朝鮮半島の近現代
lead: 1875年の江華島事件と翌年の日朝修好条規から、壬午事変と甲申政変、ハーグ密使事件、伊藤博文の暗殺、日韓併合条約の調印、三・一独立運動、大韓民国と朝鮮民主主義人民共和国の成立、朝鮮戦争の勃発とソウル陥落・仁川上陸作戦・中国人民志願軍の攻撃・休戦、四月革命と5・16軍事クーデター、日韓基本条約、北朝鮮の社会主義憲法、文世光事件、朴正煕大統領の暗殺と粛軍クーデター、光州事件、大韓航空機撃墜事件と大韓航空機爆破事件、民主化宣言、ソウルオリンピック、南北の国連同時加盟、金日成の死去、金大中の大統領就任と初の南北首脳会談、日朝首脳会談、北朝鮮の核実験、第2回南北首脳会談、哨戒艦「天安」の沈没と延坪島砲撃事件、金正日の死去、朴槿恵の大統領就任と弾劾訴追、セウォル号沈没事故、板門店宣言と米朝首脳会談、尹錫悦大統領の非常戒厳令と弾劾まで。朝鮮半島の150年をたどる。
description: 江華島事件と日韓併合条約から、三・一独立運動、朝鮮戦争、光州事件、民主化宣言、南北首脳会談と米朝首脳会談、2024年の非常戒厳令まで、朝鮮半島の近現代を年代順にたどる特集。
