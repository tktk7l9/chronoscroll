# History of volcanic eruptions (collection)
# References to existing auto-generated events only (nothing newly written). Krakatoa (1883) and Bandai (1888); the
# great eruption of Sakurajima (1914) and Tokachi (1926); Asama, Agung, the birth of Surtsey, Usu (1977 and 2000),
# Ontake (1979 and 2014), Mount St. Helens, Miyake (1983, the evacuation of 2000 and the return of 2005), Nevado del
# Ruiz, Izu Oshima (1986), Unzen (the 1990 eruption and the pyroclastic flow of 1991), Soufriere Hills, Meakan,
# Nishinoshima, Kuchinoerabu, Kusatsu-Shirane, Fukutoku-Okanoba, the Hunga Tonga eruption as felt in Japan and
# Sakurajima's alert level 5 in 2022.
# Overlaps: Bandai, Sakurajima 1914, Unzen 1991, the Miyake evacuation and Ontake 2014 are also in the disaster
# collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: Vesuvius 24 Apr 1872, Miyake 1874, Cotopaxi 1877, Novarupta 1912, Etna
# 1923 and 1971, Kuchinoerabu 1933, Showa-shinzan 1944, Hekla 1947, Mihara 1951, Aso 1953 and Miyake 1962 / not dated
# in the articles (year or month only); Tarawera 10 Jun 1886 "120 dead" / about 150; Pelee 8 May 1902 "32,000 dead" /
# 24,000 or 30,000-40,000, the number is uncertain; Santa Maria 1902, El Chichon 1982 and Puyehue 2011 / no ja
# article; Asama 2 Feb 2009 / the time and plume height are not in the article; Eyjafjallajokull 14 Apr 2010 / the
# leaders missing the Polish state funeral are not in the article; Shinmoedake 26 Jan 2011 "first magmatic eruption in
# 189 years" / about 300 years; Anak Krakatau 22 Dec 2018 "426 dead" / not in the article; La Palma 19 Sep 2021 "about
# 6,000 evacuated" / about 5,000; Hunga Tonga 15 Jan 2022 (world entry) "a 300 km wide cloud" / not in the article,
# the Japanese entry of the same day is used; Hayli Gubbi 23 Nov 2025 "first eruption in about 10,000 years" / no
# eruption recorded for 12,000 years).
slug: volcano
title: 火山噴火の歴史
lead: 1883年のクラカタウの大噴火と1888年の磐梯山の山体崩壊から、桜島の大正大噴火、十勝岳の大噴火、浅間山・有珠山・御嶽山の噴火、スルツェイ島の誕生、セント・ヘレンズ山の山体崩壊、ネバドデルルイス火山の大惨事、伊豆大島と三宅島の全島避難、雲仙普賢岳の火砕流、西之島と福徳岡ノ場の新島、トンガの火山の噴火による潮位変化と津波警報、桜島の噴火警戒レベル5まで。世界と日本の火山噴火の歴史をたどる。
description: クラカタウ、磐梯山、桜島の大正大噴火から、セント・ヘレンズ山、雲仙普賢岳の火砕流、三宅島の全島避難、御嶽山の噴火、トンガの火山の噴火まで、世界と日本の火山噴火を年代順にたどる特集。
icon: art-pelee
