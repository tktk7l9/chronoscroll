# History of nuclear weapons and disarmament (collection)
# References to existing auto-generated events only (nothing newly written).
# Sets the spread of nuclear weapons (the first test by each new nuclear power) beside the test bans,
# arms-control treaties and the movement of the hibakusha.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: Einstein's letter "sent" to Roosevelt on 2 Aug 1939 / the letter is dated 2 Aug and
# reached Roosevelt on 11 Oct; Sato stating the three non-nuclear principles on 27 Jan 1968 / first stated
# in the Diet on 11 Dec 1967).
slug: nuclear
title: 核兵器と軍縮の歴史
lead: 1942年に始まったマンハッタン計画から、トリニティ実験、広島と長崎への原爆投下、第五福竜丸の被曝、キューバ危機、核拡散防止条約、そして日本被団協のノーベル平和賞まで。核兵器を持つ国が増えていく流れと、核実験の禁止や軍縮の条約、被爆者の運動を並べてたどる。
description: マンハッタン計画から日本被団協のノーベル平和賞まで、核兵器の開発と拡散、核実験の禁止や軍縮条約、被爆者の運動を年代順にたどる特集。
icon: art-hiroshima
