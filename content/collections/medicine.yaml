# History of medicine and infectious disease (collection)
# References to existing auto-generated events only (nothing newly written).
# Pairs the science (bacteriology, vaccines, antibiotics, regenerative medicine) with outbreaks and
# Japan's health-policy milestones.
# Left out on purpose: entries whose dataset date disagrees with the topic article
# (SARS was designated a "new infectious disease" on 3 Apr 2003, not 4 Apr).
slug: medicine
title: 医学と感染症の歴史
lead: コレラが猛威を振るった明治の日本と、コッホの結核菌、パスツールの狂犬病ワクチン、北里柴三郎のペスト菌から、ペニシリン、天然痘の根絶、iPS細胞、そして新型コロナのパンデミックまで。病原体を突き止め、ワクチンと薬で立ち向かってきた医学の歩みを、国民健康保険や臓器移植法など日本の医療制度の転換点とともにたどる。
description: コッホの結核菌発見から新型コロナの5類移行まで、感染症との闘いと医学の転換点を、日本の研究者と医療制度の歩みとともに年代順にたどる特集。
icon: art-penicillin
