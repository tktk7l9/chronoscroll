# History of nuclear power (collection)
# References to existing auto-generated events only (nothing newly written).
# The first chain reaction at Chicago, the Japan-US nuclear agreement and the Euratom treaty; the Kyshtym, Windscale
# and Fermi 1 accidents; the nuclear ship Mutsu and Fukushima Daiichi unit 1; Three Mile Island, Chernobyl, the Monju
# sodium leak and the Tokai reprocessing fire; TEPCO's inspection cover-up, the Mihama steam accident and the Shika
# criticality revealed in 2007; the Fukushima Daiichi accident (loss of cooling, the unit 1 hydrogen explosion, INES
# level 7), the Hamaoka shutdown request, the first restart at Ohi, the Nuclear Regulation Authority, the Fukui court
# injunction, the first restart under the new rules at Sendai, Germany's last reactors and Onagawa's return to
# commercial operation.
# Germany's shutdown (15 Apr 2023) is checked against en "Nuclear power in Germany" (ja gives April 2023 only).
# Overlaps: the Chicago chain reaction is also in the nuclear weapons collection and the launch of Mutsu in ships.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date or
# details the articles cannot confirm (dataset vs article: Obninsk "starts operating" 27 Jun 1954 / operation from
# 1 Jun, commissioned 25 Jun, grid connection 26 Jun; uranium at Ningyo-toge (Dec 1955, month) / the outcrop was found
# 12 Nov 1955; JRR-1 criticality 27 Aug 1957 / 「午前5時23分」「原子の火」 are not in the articles; the Tsuruga leak
# 18 Apr 1981 / 「累計101人の被曝」 is not in the article; the JCO accident 30 Sep 1999 「日本初の臨界事故」 / the
# article says the first deaths from accident exposure in Japan (and Shika had a criticality in Jun 1999); Genkai's
# plu-thermal approval 26 Mar 2006 / March 2006 only; all reactors stopped 5 May 2012 「23:00」「50基」 / 23:03, no
# count; Fukushima Daiichi units 1-4 retired 19 Apr 2012 and units 5-6 18 Dec 2013 / the reactor counts (54 to 50,
# 48) are not in the articles; Monju's decommissioning plan 28 Mar 2018 / not dated; the treated water decision
# 13 Apr 2021 / the IAEA quote is not in the article; the start of the ALPS discharge 24 Aug 2023 / 「北朝鮮」 is not
# in the article; the fuel debris trial 10 Sep 2024 / not dated; Onagawa's restart 29 Oct 2024 「BWRとして震災後初」
# / not in the article; Shimane's restart 7 Dec 2024 / commercial operation from 10 Jan is not in the article; the
# drone strike on Chernobyl 14 Feb 2025 「コンクリート製のシェルター」 / it hit the New Safe Confinement (en); Taiwan's
# last reactor 17 May 2025 / 「1970年代に最初の原発が商用運転を開始して以来」 is not in the article; the Hamaoka
# review halted 7 Jan 2026 / 「白紙化する方針」 is not in the article; Kashiwazaki-Kariwa unit 6 restarts 15 Feb 2026 /
# restarted 9 Feb 2026; the operating-period rule change 13 Feb 2023 / not dated).
slug: nuclear-power
title: 原子力発電の歴史
lead: 1942年のシカゴ大学でのウラン核分裂連鎖反応の成功から、日米原子力協定と欧州原子力共同体設立条約、原子力船「むつ」の進水、東京電力福島原子力発電所の運転開始、ウィンズケール・スリーマイル島・チェルノブイリの原子力事故、もんじゅのナトリウム漏洩事故、福島第一原子力発電所事故とレベル7の評価、原子力規制委員会の発足と新規制基準での初の再稼働、ドイツの全原発停止まで。ウラル核惨事や東京電力の自主点検の不正、運転差し止め判決も含めて、原子力発電の歩みをたどる。
description: シカゴ大学の核分裂連鎖反応の成功から、スリーマイル島・チェルノブイリ・福島第一の原子力事故、原子力規制委員会の発足と再稼働、ドイツの全原発停止まで、原子力発電の節目を日本と世界の出来事で年代順にたどる特集。
