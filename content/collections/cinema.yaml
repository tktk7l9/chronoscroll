slug: cinema
title: 映画の歴史
lead: 1888年の最初の撮影から、リュミエール兄弟の興行、トリック映画、総天然色、ゴジラ、そして日本映画が世界の賞を取るまで。
description: 世界初の映画撮影からアカデミー賞・カンヌ・ヴェネツィアでの日本映画の受賞まで、映画という表現の百三十年を年代順にたどる特集。
