# History of cinema (collection)
# References to existing auto-generated events only (nothing newly written).
# The keywords カンヌ and 映画 also find G20 summits, jewel robberies and actors' obituaries, so the entries are limited
# to milestones of films and filmmaking.
# Audited against the topic articles (2026-10-13): 23 entries checked, 8 corrected (7 in fixes.yaml, 1 in
# top50.yaml), none dropped. Corrected: Roundhay Garden Scene, now 「現存する最古の映画とされる」 rather than the first film (en
# "Roundhay Garden Scene"); the Lumière screening, their first commercial one rather than the first paid one (en
# "Lumière brothers": the Eidoloscope and the Skladanowskys had shown films to paying audiences earlier in 1895);
# The Birth of a Nation, the first non-serial American 12-reel film, not the first American feature (en "Feature
# film"); the Academy, founded on 11 May (ja and en; 4 May was the filing of the articles of incorporation);
# Kagemusha's Palme d'Or, shared with All That Jazz (the line called it グランプリ); Kurosawa's honorary Academy Award
# (the line said 特別名誉賞); Okuribito, the first Japanese winner since 宮本武蔵 at the 28th Academy Awards in 1956 (the
# line said 1955 and 54 years); Kurosawa Kiyoshi's Silver Lion, the first for a Japanese director since Kitano in
# 2003 (the line had Mizoguchi winning in 1952, a year 銀獅子賞 does not list for him).
# Dates checked against the festivals: Mifune's Best Actor award on 3 Sep 1961 and Kagemusha's Palme d'Or on 23 May
# 1980 fall on the closing days of the 22nd Venice (20 Aug - 3 Sep) and 33rd Cannes (9-23 May) festivals. The lead
# and description now speak of the oldest surviving film instead of the first filming.
slug: cinema
title: 映画の歴史
lead: 1888年に撮影された現存最古の映画から、リュミエール兄弟の興行、トリック映画、総天然色、ゴジラ、そして日本映画が世界の賞を取るまで。
description: 現存最古の映画からアカデミー賞・カンヌ・ヴェネツィアでの日本映画の受賞まで、映画という表現の百三十年あまりを年代順にたどる特集。
icon: art-cinema-birth
entries:
