# Germany (collection)
# References to existing auto-generated events only (nothing newly written). The proclamation of the German Empire,
# the Year of the Three Emperors and Bismarck's dismissal; the Weimar constitution, the Beer Hall Putsch and Mein
# Kampf; Hitler's chancellorship, the Enabling Act, the Night of the Long Knives, the Nuremberg Laws, the Anschluss,
# Kristallnacht and the invasion of Poland; Hitler's suicide and the Nuremberg trials; the Berlin blockade, the
# western zones merged and the founding of East Germany; the uprising of 1953, the Paris agreements in force, the
# Berlin Wall, the Erfurt summit, both Germanys joining the UN and Brandt's resignation; Honecker's fall, the fall
# of the Wall, the free election in the East, the unification treaty and reunification; Schröder and Merkel.
# Checked against en: the Year of the Three Emperors (1888, "Year of the Three Emperors").
# The Enabling Act (23 Mar 1933) is included with the date and wording corrected in fixes.yaml, and Kristallnacht (9
# Nov 1938) and the Paris agreements (5 May 1955) with the wording corrected (2026-10-13).
# Overlaps: the Nuremberg Laws are also in the human rights collection; the invasion of Poland and Hitler's suicide
# in the Second World War collection; the Berlin blockade, the founding of East Germany, the Berlin Wall, the Erfurt
# summit, the fall of the Wall and reunification in the Cold War collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: Wilhelm II "abdicates and flees to the Netherlands" 10 Nov 1918 / his
# reign ended on 9 Nov and he signed the abdication on 28 Nov, the flight is not dated).
slug: germany
title: ドイツの近現代
lead: 1871年のドイツ帝国の成立から、三皇帝年、ビスマルクの解任、ヴァイマル憲法、ミュンヘン一揆、『我が闘争』、ヒトラーの首相就任、全権委任法、長いナイフの夜、ニュルンベルク法、オーストリア併合、水晶の夜、ポーランド侵攻、ヒトラーの自殺、ニュルンベルク裁判、ベルリン封鎖、西側3占領地域の統合と東ドイツの成立、東ベルリンの6月17日事件、パリ協定の発効、ベルリンの壁、初の東西ドイツ首脳会談、東西ドイツの国連加盟、ブラントの辞任、ホーネッカーの失脚、ベルリンの壁崩壊、東ドイツ初の自由選挙、ドイツ再統一条約とドイツ再統一、シュレーダー政権の発足、メルケルの首相就任まで。帝国から分断、再統一に至るドイツの130年余りをたどる。
description: ドイツ帝国の成立から、ヴァイマル憲法、ヒトラーの首相就任とナチス・ドイツ、東西分裂とベルリンの壁、壁の崩壊とドイツ再統一、メルケルの首相就任まで、ドイツの近現代を年代順にたどる特集。
