# History of space exploration (collection)
# References to existing auto-generated events only (nothing newly written).
# Left out on purpose: keyword matches on other subjects (a firework rocket, the opening of the Space World theme
# park, the Sputnik V vaccine).
# Audited against the topic articles (2026-10-13): 33 entries checked, 6 corrected in fixes.yaml, none dropped.
# Corrected: Leonov's rank 中佐, which neither ボスホート2号 nor アレクセイ・レオーノフ gives; Apollo 17's note 「2025年現在最後の有人月面探査」, now
# the article's 「史上6度目にして最後の有人月面着陸」; Hayabusa's sample return, the first from a body other than the Moon (the line
# said the first after landing on any body, while Luna 16 had brought back lunar samples in 1970); the comet
# landing, made by Rosetta's lander Philae; Cassini's last signal, now given in UTC, and the reason for the plunge
# (microbes riding on the probe, not on the moons); SN10, which landed and then exploded eight minutes later.
# Dates kept on purpose: Luna 2 on 14 Sep (en "Luna 2" has the impact on 13 September 21:02 GMT, "14th of September
# according to Moscow's time zone"; ja also gives 14日), SN10 on 3 Mar (the local date in en "List of Starship
# vehicles"; ja gives 4 Mar, Japan time).
slug: space
title: 宇宙開発の歴史
lead: 1926年の液体燃料ロケットから、スプートニク、ガガーリン、アポロ11号、ボイジャーの太陽圏脱出、そして小惑星からの試料回収と民間宇宙船まで。
description: ゴダードの液体燃料ロケットからはやぶさ2・スターシップまで、人類が地球の外へ出ていった道のりを年代順にたどる特集。
icon: art-apollo11
