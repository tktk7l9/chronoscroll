# 観葉植物の歴史（特集）
# 既存の自動生成データは「植物園開園」ばかりで観葉植物そのものの歴史が無いため、全て新規イベント。
# 出典URLは ja Wikipedia の実在記事のみ（2026-07 時点で存在を確認済み）。
# importance は 40〜60 に抑え、概観ズームで本編を汚さないようにする。
slug: houseplant
title: 観葉植物の歴史
lead: ガラス箱ひとつで植物が船旅を生き延びられるようになった19世紀から、シダ狂時代、アスピディストラ、1970年代のブーム、そして巣ごもり需要まで。
description: ウォードの箱の発明からコロナ禍の観葉植物ブームまで、室内で植物を育てる文化がどう生まれ広がったかを年代順にたどる特集。
icon: art-collection-houseplant
entries:
  # --- 19世紀：植物が室内に入るための技術 ---
  - id: 1829-01-01-hp-wardian-case
    date: "1829-01-01"
    precision: year
    title: ウォードの箱が発明される
    summary: ロンドンの医師ナサニエル・バグショー・ウォードが、密閉したガラス容器の中で植物が長期間生きることを偶然発見した。のちに「ウォードの箱」と呼ばれるこの容器は、煤煙に満ちた都市の室内でも植物を育てられるようにし、観葉植物文化の技術的な出発点となった。
    category: science
    region: world
    importance: 56
    svg: art-wardian-case
    sources:
      - { label: "Wikipedia: ウォードの箱", url: "https://ja.wikipedia.org/wiki/ウォードの箱" }
      - { label: "Wikipedia: ナサニエル・バグショー・ウォード", url: "https://ja.wikipedia.org/wiki/ナサニエル・バグショー・ウォード" }
    relatedIds: ["1842-01-01-hp-ward-book", "1848-01-01-hp-palm-house"]

  - id: 1842-01-01-hp-ward-book
    date: "1842-01-01"
    precision: year
    title: ウォードが密閉ガラス容器での植物栽培を著書で公開
    summary: ウォードが『密閉したガラス容器内での植物の生育について』を刊行し、ガラス容器による栽培法が広く知られるようになった。以後この箱は、遠洋航海で植物を生きたまま運ぶ標準的な道具となり、園芸と植民地経済の両方を変えた。
    category: science
    region: world
    importance: 48
    sources:
      - { label: "Wikipedia: ウォードの箱", url: "https://ja.wikipedia.org/wiki/ウォードの箱" }
      - { label: "Wikipedia: テラリウム", url: "https://ja.wikipedia.org/wiki/テラリウム" }

  - id: 1843-01-01-hp-plant-hunter
    date: "1843-01-01"
    precision: year
    title: ロバート・フォーチュンが中国へ植物採集に赴く
    summary: プラントハンターのロバート・フォーチュンが中国へ渡り、ウォードの箱を用いて多数の植物を英国へ持ち帰った。19世紀の植物採集ブームは熱帯・亜熱帯の観葉植物を欧州の温室と居間に流し込み、「室内で異国の緑を眺める」趣味を成立させた。
    category: science
    region: world
    importance: 47
    sources:
      - { label: "Wikipedia: ロバート・フォーチュン", url: "https://ja.wikipedia.org/wiki/ロバート・フォーチュン" }
      - { label: "Wikipedia: プラントハンター", url: "https://ja.wikipedia.org/wiki/プラントハンター" }

  - id: 1848-01-01-hp-palm-house
    date: "1848-01-01"
    precision: year
    title: キューガーデンのパームハウスが完成
    summary: ロンドンのキュー王立植物園に、鉄とガラスによる大温室パームハウスが完成した。熱帯植物を通年で育てられる建築が実現し、ヤシやシダといった観葉植物の姿が一般の来園者にとって身近なものになった。
    category: science
    region: world
    importance: 50
    sources:
      - { label: "Wikipedia: キューガーデン", url: "https://ja.wikipedia.org/wiki/キューガーデン" }
      - { label: "Wikipedia: 温室", url: "https://ja.wikipedia.org/wiki/温室" }

  - id: 1851-05-01-hp-crystal-palace
    date: "1851-05-01"
    precision: month
    title: ロンドン万国博覧会の水晶宮が室内緑化の理想像を示す
    summary: 第1回ロンドン万国博覧会の会場となった水晶宮は、鉄とガラスの巨大な構造の中に樹木を取り込んだ建築だった。「ガラスに囲まれた明るい空間で植物と暮らす」というヴィクトリア朝の理想を可視化し、住宅のサンルームや温室趣味の流行を後押しした。
    category: culture
    region: world
    importance: 52
    sources:
      - { label: "Wikipedia: 水晶宮", url: "https://ja.wikipedia.org/wiki/水晶宮" }
      - { label: "Wikipedia: ロンドン万国博覧会", url: "https://ja.wikipedia.org/wiki/ロンドン万国博覧会" }

  - id: 1855-01-01-hp-pteridomania
    date: "1855-01-01"
    precision: year
    title: シダ狂時代（Pteridomania）が流行
    summary: 英国でシダの収集・栽培熱が最盛期を迎え、作家チャールズ・キングズリーはこれを「シダ狂（Pteridomania）」と呼んだ。ウォードの箱で育てるシダは室内装飾の定番となり、植物を家具のように飾る習慣が中産階級に定着した。
    category: culture
    region: world
    importance: 49
    svg: art-fern
    sources:
      - { label: "Wikipedia: シダ植物", url: "https://ja.wikipedia.org/wiki/シダ植物" }
      - { label: "Wikipedia: チャールズ・キングズリー", url: "https://ja.wikipedia.org/wiki/チャールズ・キングズリー" }
      - { label: "Wikipedia: ヴィクトリア朝", url: "https://ja.wikipedia.org/wiki/ヴィクトリア朝" }

  - id: 1870-01-01-hp-aspidistra
    date: "1870-01-01"
    precision: year
    title: ハラン（アスピディストラ）が室内植物の代表になる
    summary: 東アジア原産のハランが、ガス灯の煤や暗さに強い性質からヴィクトリア朝の室内植物として広く普及した。英語圏では丈夫さの象徴として cast-iron plant と呼ばれ、のちに中産階級の生活の記号として文学にも登場する。
    category: culture
    region: world
    importance: 44
    sources:
      - { label: "Wikipedia: ハラン (植物)", url: "https://ja.wikipedia.org/wiki/ハラン_(植物)" }

  - id: 1890-01-01-hp-ficus
    date: "1890-01-01"
    precision: year
    title: インドゴムノキが室内観葉植物として広まる
    summary: インドゴムノキ（フィカス・エラスティカ）が、光量の少ない室内でも育つ観葉植物として欧米と日本の双方で普及した。大きく艶のある葉は近代的な室内装飾と相性がよく、20世紀を通じて最も見慣れた観葉植物のひとつになった。
    category: culture
    region: world
    importance: 43
    sources:
      - { label: "Wikipedia: インドゴムノキ", url: "https://ja.wikipedia.org/wiki/インドゴムノキ" }
      - { label: "Wikipedia: ゴムノキ", url: "https://ja.wikipedia.org/wiki/ゴムノキ" }

  # --- 20世紀：産業と大衆化 ---
  - id: 1950-01-01-hp-florida
    date: "1950-01-01"
    precision: year
    title: 米国で観葉植物の商業生産が本格化
    summary: 第二次世界大戦後の住宅建設ブームを背景に、米国フロリダ州を中心とする温暖地で観葉植物（foliage plant）の大量生産が本格化した。安価な鉢植えが全国の小売に並び、観葉植物は一部の趣味人のものから日用品に近い存在へ変わった。
    category: economy
    region: world
    importance: 45
    sources:
      - { label: "Wikipedia: 観葉植物", url: "https://ja.wikipedia.org/wiki/観葉植物" }
      - { label: "Wikipedia: 園芸", url: "https://ja.wikipedia.org/wiki/園芸" }

  - id: 1960-01-01-hp-saintpaulia
    date: "1960-01-01"
    precision: year
    title: セントポーリアが室内園芸の人気種になる
    summary: アフリカ原産のセントポーリアが、小さな鉢で室内の窓辺で咲かせられる草花として世界的な人気を得た。愛好会と品種改良の輪が各国に広がり、「室内で花を咲かせる」タイプの園芸が観葉植物文化の一部として定着した。
    category: culture
    region: world
    importance: 42
    sources:
      - { label: "Wikipedia: セントポーリア", url: "https://ja.wikipedia.org/wiki/セントポーリア" }

  - id: 1970-01-01-hp-70s-boom
    date: "1970-01-01"
    precision: year
    title: 1970年代の観葉植物ブーム
    summary: 欧米と日本で観葉植物の大流行が起こり、ポトスやモンステラ、ドラセナを吊り鉢やマクラメで飾るスタイルが広まった。自然回帰の風潮と集合住宅の普及が重なり、限られた室内空間に緑を持ち込む方法として観葉植物が選ばれた。
    category: culture
    region: both
    importance: 54
    svg: art-monstera
    sources:
      - { label: "Wikipedia: 観葉植物", url: "https://ja.wikipedia.org/wiki/観葉植物" }
      - { label: "Wikipedia: ポトス", url: "https://ja.wikipedia.org/wiki/ポトス" }
      - { label: "Wikipedia: モンステラ属", url: "https://ja.wikipedia.org/wiki/モンステラ属" }
    relatedIds: ["2020-05-01-hp-covid-boom", "1855-01-01-hp-pteridomania"]

  - id: 1970-03-15-hp-expo70
    date: "1970-03-15"
    precision: month
    title: 大阪万博の温室展示が熱帯植物を身近にする
    summary: 日本万国博覧会で各国のパビリオンが熱帯植物を用いた展示を行い、来場者が異国の大型植物を目にする機会となった。高度成長期の住宅事情と重なって、日本でも観葉植物を室内装飾として置く習慣が広がっていった。
    category: culture
    region: japan
    importance: 46
    sources:
      - { label: "Wikipedia: 日本万国博覧会", url: "https://ja.wikipedia.org/wiki/日本万国博覧会" }
      - { label: "Wikipedia: 熱帯雨林", url: "https://ja.wikipedia.org/wiki/熱帯雨林" }

  - id: 1980-01-01-hp-hydroculture
    date: "1980-01-01"
    precision: year
    title: ハイドロカルチャーが室内向けに普及
    summary: 土を使わず発泡煉石などの人工材と水で育てるハイドロカルチャーが、清潔さと管理の手軽さから室内園芸に広まった。虫や土のこぼれを嫌うオフィスや住宅で採用され、観葉植物をインテリア商品として扱う流れを加速させた。
    category: science
    region: both
    importance: 41
    sources:
      - { label: "Wikipedia: ハイドロカルチャー", url: "https://ja.wikipedia.org/wiki/ハイドロカルチャー" }

  - id: 1989-09-01-hp-nasa-study
    date: "1989-09-01"
    precision: month
    title: NASAが観葉植物の空気浄化効果を報告
    summary: アメリカ航空宇宙局が室内空気の汚染物質を植物が除去する可能性を示す研究報告を公表した。閉鎖環境の空気清浄を想定した実験だったが、「観葉植物は空気をきれいにする」という通俗的な理解として広まり、以後の販売文脈に長く影響を残した。
    category: science
    region: world
    importance: 50
    sources:
      - { label: "Wikipedia: アメリカ航空宇宙局", url: "https://ja.wikipedia.org/wiki/アメリカ航空宇宙局" }
      - { label: "Wikipedia: 観葉植物", url: "https://ja.wikipedia.org/wiki/観葉植物" }

  - id: 1995-01-01-hp-office-green
    date: "1995-01-01"
    precision: year
    title: オフィス緑化と園芸療法への注目
    summary: 職場や病院に植物を置く効果が注目され、日本でもオフィス緑化やレンタル観葉植物の事業が広がった。同時期に園芸療法の考え方が紹介され、観葉植物は装飾だけでなく心身への働きかけという文脈でも語られるようになった。
    category: society
    region: japan
    importance: 42
    sources:
      - { label: "Wikipedia: 園芸療法", url: "https://ja.wikipedia.org/wiki/園芸療法" }
      - { label: "Wikipedia: 観葉植物", url: "https://ja.wikipedia.org/wiki/観葉植物" }

  # --- 21世紀：SNSと巣ごもり ---
  - id: 2012-01-01-hp-succulent
    date: "2012-01-01"
    precision: year
    title: 多肉植物とエアプランツの流行
    summary: 水やりの頻度が低く小さな器で育てられる多肉植物やエアプランツが流行した。写真映えする形と手軽さが写真共有SNSと相性がよく、観葉植物の楽しみ方が「育てる」から「並べて見せる」方向へも広がった。
    category: culture
    region: both
    importance: 45
    sources:
      - { label: "Wikipedia: 多肉植物", url: "https://ja.wikipedia.org/wiki/多肉植物" }
      - { label: "Wikipedia: エアプランツ", url: "https://ja.wikipedia.org/wiki/エアプランツ" }
      - { label: "Wikipedia: サボテン", url: "https://ja.wikipedia.org/wiki/サボテン" }

  - id: 2020-05-01-hp-covid-boom
    date: "2020-05-01"
    precision: month
    title: コロナ禍の巣ごもり需要で観葉植物ブーム
    summary: 新型コロナウイルスの流行による在宅時間の増加を受け、世界各地で観葉植物の需要が急増した。園芸店やオンライン販売が品薄になり、室内で植物を育てることが自宅環境を整える手段として広く受け入れられた。1970年代以来の大きな流行となった。
    category: society
    region: both
    importance: 58
    svg: art-collection-houseplant
    sources:
      - { label: "Wikipedia: 新型コロナウイルス感染症の世界的流行 (2019年-)", url: "https://ja.wikipedia.org/wiki/新型コロナウイルス感染症の世界的流行_(2019年-)" }
      - { label: "Wikipedia: 巣ごもり消費", url: "https://ja.wikipedia.org/wiki/巣ごもり消費" }
      - { label: "Wikipedia: 観葉植物", url: "https://ja.wikipedia.org/wiki/観葉植物" }
    relatedIds: ["1970-01-01-hp-70s-boom", "2021-06-01-hp-variegated-price"]

  - id: 2021-06-01-hp-variegated-price
    date: "2021-06-01"
    precision: month
    title: 斑入り観葉植物が高値で取引される
    summary: 葉に白い模様が出る斑入りのモンステラなどが投機的な高値で取引され、ニュージーランドのオークションでは1株が数千ドル規模で落札されて話題になった。観葉植物ブームが希少個体の市場を生み、価格が生育の難しさや流通量と切り離されて動いた局面である。
    category: economy
    region: world
    importance: 49
    sources:
      - { label: "Wikipedia: 斑入り", url: "https://ja.wikipedia.org/wiki/斑入り" }
      - { label: "Wikipedia: モンステラ属", url: "https://ja.wikipedia.org/wiki/モンステラ属" }

  - id: 2022-01-01-hp-platycerium
    date: "2022-01-01"
    precision: year
    title: ビカクシダの板付け栽培が人気を集める
    summary: ビカクシダ（コウモリラン）を板やコルクに着生させて壁に掛ける栽培法が、日本を中心に人気を集めた。鉢を床に置く従来の観葉植物と違い壁面を使うため、狭い住宅でも大型の株を楽しめる方法として定着した。
    category: culture
    region: japan
    importance: 44
    sources:
      - { label: "Wikipedia: ビカクシダ属", url: "https://ja.wikipedia.org/wiki/ビカクシダ属" }
      - { label: "Wikipedia: 観葉植物", url: "https://ja.wikipedia.org/wiki/観葉植物" }
