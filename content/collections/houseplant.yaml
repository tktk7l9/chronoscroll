    relatedIds: ["1855-01-01-hp-pteridomania", "2021-06-01-hp-variegated-price"]

  - id: 2021-06-01-hp-variegated-price
    date: "2021-06-13"
    precision: day
    title: "斑入りの観葉植物1株が2万7100NZドルで落札"
    summary: "ニュージーランドのネットオークション「トレードミー」で、斑入りのラフィドフォラ・テトラスペルマ1株が過去最高の2万7100ニュージーランドドル（約1万9300米ドル）で落札された。"
    category: economy
    region: world
