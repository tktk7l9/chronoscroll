# History of houseplants (collection)
# The auto-generated data has only botanical-garden openings, so every entry is written here, with ja/en Wikipedia
# articles as sources. Importance is kept at 40-60 so that the entries do not crowd the overview zoom.
# Audited against the topic articles (2026-10-13): 19 entries checked, 9 corrected here, 10 dropped. Corrected: the
# Wardian case, the Ward book, Robert Fortune's first journey (Hong Kong in 1843, 250 species brought home in
# Wardian cases in 1846) and the Palm House at Kew, each now limited to what ja ウォードの箱, ロバート・フォーチュン and キューガーデン say;
# the Great Exhibition, which opened on 1 May 1851 in the Crystal Palace with elm trees inside (ja ロンドン万国博覧会
# (1851年), en "The Crystal Palace"; the source was the ja disambiguation page); pteridomania, the word Charles
# Kingsley coined in 1855 (en "Pteridomania"); the NASA Clean Air Study, dated to its year 1989 and with the
# article's caveat that it does not apply to ordinary buildings; the pandemic interest in houseplants, dated to 2020
# (en "Houseplant"; the month and the sold-out shops are in no article); the variegated plant sold for a record
# NZ$27,100 on 13 Jun 2021, a Rhaphidophora tetrasperma, not a Monstera, and not "a few thousand dollars" (en
# "Rhaphidophora tetrasperma").
# Dropped, because no article gives their year (the trends are real, the years were not): 1870-01-01-hp-aspidistra,
# 1890-01-01-hp-ficus, 1950-01-01-hp-florida (en "Houseplant" has Florida growing 55% of US houseplants by 1960),
# 1960-01-01-hp-saintpaulia, 1970-01-01-hp-70s-boom (the article speaks of the decade), 1970-03-15-hp-expo70,
# 1980-01-01-hp-hydroculture, 1995-01-01-hp-office-green, 2012-01-01-hp-succulent and 2022-01-01-hp-platycerium.
# Because the entries are defined here, they leave the timeline too. The lead no longer names the aspidistra and the
# 1970s boom.
slug: houseplant
title: 観葉植物の歴史
lead: ガラス箱ひとつで植物が船旅を生き延びられるようになった19世紀から、シダ狂時代、NASAの空気浄化の研究、そしてコロナ禍の巣ごもり需要まで。
description: ウォードの箱の発明からコロナ禍の観葉植物ブームまで、室内で植物を育てる文化がどう生まれ広がったかを年代順にたどる特集。
icon: art-collection-houseplant
entries:
  # --- The 19th century: bringing plants indoors ---
  - id: 1829-01-01-hp-wardian-case
    date: "1829-01-01"
    precision: year
    title: ウォードの箱が発明される
    summary: "ロンドンの医師ナサニエル・バグショー・ウォードが、密閉したガラス容器の中ならシダが育つことを偶然見つけた。この容器はのちに「ウォードの箱」と呼ばれ、植物を生きたまま船で運ぶのに使われたほか、汚れた空気のヴィクトリア朝の都市で室内にシダやランを育てる流行を支えた。"
    category: science
    region: world
    importance: 56
    svg: art-wardian-case
    sources:
      - { label: "Wikipedia: ウォードの箱", url: "https://ja.wikipedia.org/wiki/ウォードの箱" }
      - { label: "Wikipedia: ナサニエル・バグショー・ウォード", url: "https://ja.wikipedia.org/wiki/ナサニエル・バグショー・ウォード" }
    relatedIds: ["1842-01-01-hp-ward-book", "1848-01-01-hp-palm-house"]

  - id: 1842-01-01-hp-ward-book
    date: "1842-01-01"
    precision: year
    title: "ウォードがガラス容器での植物栽培の研究をまとめる"
    summary: "ウォードが著書『ガラス容器内での植物の成長』（On the Growth of Plants in Closely Glazed Cases）を刊行し、密閉したガラス容器で植物を育てる研究をまとめた。この箱で運ばれた茶やゴムの木の苗は、のちに商業的に価値のある植物の産地の独占を崩すことになった。"
    category: science
    region: world
    importance: 48
    sources:
      - { label: "Wikipedia: ウォードの箱", url: "https://ja.wikipedia.org/wiki/ウォードの箱" }
      - { label: "Wikipedia: テラリウム", url: "https://ja.wikipedia.org/wiki/テラリウム" }

  - id: 1843-01-01-hp-plant-hunter
    date: "1843-01-01"
    precision: year
    title: "ロバート・フォーチュンが中国で植物採集を始める"
    summary: "ロンドン園芸協会が派遣したプラントハンターのロバート・フォーチュンが香港に到着し、中国で植物の採集を始めた。1846年には、ウォードの箱を本格的に使って250種の植物を英国へ持ち帰った。"
    category: science
    region: world
    importance: 47
    sources:
      - { label: "Wikipedia: ロバート・フォーチュン", url: "https://ja.wikipedia.org/wiki/ロバート・フォーチュン" }
      - { label: "Wikipedia: プラントハンター", url: "https://ja.wikipedia.org/wiki/プラントハンター" }

  - id: 1848-01-01-hp-palm-house
    date: "1848-01-01"
    precision: year
    title: キューガーデンのパームハウスが完成
    summary: "ロンドンのキュー王立植物園で、鉄とガラスの大温室パームハウスが完成した。1844年から建てられた世界最古級のヴィクトリア朝様式の温室で、大英帝国が各地から集めた熱帯植物を保護し、研究するための施設だった。"
    category: science
    region: world
    importance: 50
    sources:
      - { label: "Wikipedia: キューガーデン", url: "https://ja.wikipedia.org/wiki/キューガーデン" }
      - { label: "Wikipedia: 温室", url: "https://ja.wikipedia.org/wiki/温室" }

  - id: 1851-05-01-hp-crystal-palace
    date: "1851-05-01"
    precision: month
    title: "第1回万国博覧会が水晶宮で開幕"
    summary: "ロンドンのハイド・パークで第1回万国博覧会が開幕した。会場の水晶宮は、温室の設計で知られた造園家ジョセフ・パクストンによる鉄骨とガラスの巨大な建物で、敷地に立っていた大きなニレの木を何本も伐らずに建物の中に取り込んだ。"
    category: culture
    region: world
    importance: 52
    sources:
      - { label: "Wikipedia: 水晶宮", url: "https://ja.wikipedia.org/wiki/水晶宮" }
      - { label: "Wikipedia: ロンドン万国博覧会 (1851年)", url: "https://ja.wikipedia.org/wiki/ロンドン万国博覧会_(1851年)" }
      - { label: "Wikipedia (英語): The Crystal Palace", url: "https://en.wikipedia.org/wiki/The_Crystal_Palace" }

  - id: 1855-01-01-hp-pteridomania
    date: "1855-01-01"
    precision: year
    title: "キングズリーがシダの収集熱を「プテリドマニア」と呼ぶ"
    summary: "作家チャールズ・キングズリーが著書『グラウコス』で、英国に広がっていたシダの収集熱を「プテリドマニア」（シダ狂い）と呼んだ。ウォードの箱は西欧や米国のしゃれた客間に置かれるようになり、シダの流行を広めた。"
    category: culture
    region: world
    importance: 49
    svg: art-fern
    sources:
      - { label: "Wikipedia (英語): Pteridomania", url: "https://en.wikipedia.org/wiki/Pteridomania" }
      - { label: "Wikipedia: チャールズ・キングズリー", url: "https://ja.wikipedia.org/wiki/チャールズ・キングズリー" }
      - { label: "Wikipedia: ウォードの箱", url: "https://ja.wikipedia.org/wiki/ウォードの箱" }

  # --- The 20th century ---
  - id: 1989-09-01-hp-nasa-study
    date: "1989-01-01"
    precision: year
    title: "NASAが観葉植物による空気浄化の研究を発表"
    summary: "アメリカ航空宇宙局（NASA）が造園業者の団体と行った研究で、ありふれた観葉植物がベンゼンやホルムアルデヒドなどの揮発性有機化合物を空気から取り除く可能性が示された。宇宙ステーションのような密閉空間を想定した研究で、外気と入れ替わる一般の建物には当てはまらないとされる。"
    category: science
    region: world
    importance: 50
    sources:
      - { label: "Wikipedia (英語): NASA Clean Air Study", url: "https://en.wikipedia.org/wiki/NASA_Clean_Air_Study" }

  # --- The 21st century ---
  - id: 2020-05-01-hp-covid-boom
    date: "2020-01-01"
    precision: year
    title: "コロナ禍で観葉植物の人気が急上昇"
    summary: "新型コロナウイルスの流行で家で過ごす時間が増え、観葉植物への関心が急速に高まった。植物の売り上げは、この年に過去最高となった。"
    category: society
    region: both
    importance: 58
    svg: art-collection-houseplant
    sources:
      - { label: "Wikipedia (英語): Houseplant", url: "https://en.wikipedia.org/wiki/Houseplant" }
