# History of shogi, go and chess (collection)
# References to existing auto-generated events only (nothing newly written).
# The associations (Hoensha for go, FIDE, the Tokyo Shogi Federation), the Jinya incident, Habu Yoshiharu (junior-high
# professional, seven crowns, eternal seven crowns, losing the last title, leaving A class), Satomi Kana's five women's
# titles, Deep Blue against Kasparov and AlphaGo against Lee Sedol, the software-cheating affair and the Eiou-sen
# becoming a title, Kato Hifumi's retirement and farewell, the People's Honour Award for Habu and Iyama Yuta, and Fujii
# Sota from his professional qualification to all eight titles and the Prime Minister's award.
# Deep Blue's win and AlphaGo are also in the AI collection.
# The Hoensha entry has month precision and is shown with its month only.
# Duplicates: Habu's seven crowns appears twice on 14 Feb 1996; the entry naming the Osho match against Tanigawa is used.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: Steinitz the first official world chess champion 26 Mar 1886 / 1886
# only; Masuda beating Oyama with a lance handicap 20 Jan 1956 / the article dates the game 19 Jan 1956; Masuda's three
# crowns 24 Jul 1957, the NHK Cup go on television 7 Oct 1962 and Habu's record 81st title 5 Jul 2012 / not dated in
# the articles; Hayashiba Naoko the youngest women's Meijin 19 Feb 1983 / Jan-Feb 1983 only; Xie Jun women's world
# chess champion 29 Oct 1991 / 1991 only; Satomi Kana's four crowns "at 22" on 23 May 2012 / at 20 years 2 months).
slug: board-games
title: 将棋・囲碁・チェスの歴史
lead: 1879年の囲碁団体「方円社」の設立、1924年の国際チェス連盟と東京将棋連盟の設立から、陣屋事件、羽生善治の中学生棋士デビューと七冠独占、ディープ・ブルー対ガルリ・カスパロフ、囲碁AI「AlphaGo」とイ・セドル九段の対局、藤井聡太の最年少でのプロ入りと八冠達成まで。将棋ソフトをめぐる疑惑の責任を取った谷川浩司会長の辞任、羽生善治と井山裕太の国民栄誉賞、加藤一二三の引退も含めて、盤上の勝負の歩みをたどる。
description: 方円社と国際チェス連盟、東京将棋連盟の設立から、羽生善治の七冠独占、ディープ・ブルーとAlphaGo、藤井聡太の八冠達成まで、将棋・囲碁・チェスの節目を日本と世界の出来事で年代順にたどる特集。
