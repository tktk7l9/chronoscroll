# Constitutions, the Diet and elections in Japan (collection)
# References to existing auto-generated events only (nothing newly written).
# Follows who may vote and who governs: the push for an elected assembly, the Meiji Constitution and the
# Imperial Diet, universal male suffrage, the wartime one-party Diet, the postwar Constitution, the 1955 system
# and its end, and later changes to how elections work.
# Women's suffrage (1945) and the first postwar general election (1946) are in womens-rights, so not repeated.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: the Kokkai Kisei Domei "renamed from" the Aikokusha on 17 Mar 1880 / founded that day as
# a separate body; the first universal-suffrage bill submitted 12 Feb 1902 / the article gives both 12 and 15 Feb;
# the 1976 general election held 9 Dec / held 5 Dec, the term ended 9 Dec).
slug: constitution
title: 憲法と選挙の歴史
lead: 1874年の民選議院設立建白書から、大日本帝国憲法の発布と第1回衆議院議員総選挙、普通選挙法、翼賛選挙、日本国憲法の公布と施行、55年体制の始まりと崩壊、そして18歳選挙権まで。誰が選び、誰が国を動かすのかという仕組みの移り変わりを、憲法と議会、選挙の節目でたどる。
description: 民選議院設立建白書から18歳選挙権まで、日本の憲法と議会、選挙の仕組みがどう形づくられてきたかを年代順にたどる特集。
icon: art-meiji-constitution
