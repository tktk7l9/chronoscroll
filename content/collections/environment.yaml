# History of pollution and environmental issues (collection)
# References to existing auto-generated events only (nothing newly written).
# Follows Japan's pollution cases (Ashio, then the four big pollution diseases: Minamata,
# Niigata Minamata, Yokkaichi asthma, itai-itai) into national law and on to the
# international treaties on ozone, mercury and climate.
# Left out on purpose: entries whose dataset date disagrees with the topic article
# (The Limits to Growth came out on 2 Mar 1972, not 1 Mar).
slug: environment
title: 公害と環境の歴史
lead: 世界初の国立公園と足尾鉱毒事件から、水俣病をはじめとする四大公害、環境庁の発足、地球サミットと京都議定書、そしてパリ協定と脱炭素の宣言まで。地域の公害との闘いが、国境を越える気候変動対策へと広がっていく流れをたどる。
description: 足尾鉱毒事件と水俣病からパリ協定まで、日本の公害と、国境を越える環境問題への取り組みを年代順にたどる特集。
icon: art-minamata
