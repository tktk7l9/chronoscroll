# History of video games (collection)
# References to existing auto-generated events only (nothing newly written).
# From the companies' beginnings (Nintendo as a card maker, Sega's predecessor) through the first home and arcade
# games, the Famicom era and its rivals (PC Engine, Mega Drive), the handhelds (Game & Watch to the 3DS), the
# PlayStation and Xbox generations, Pokémon, Tamagotchi and Minecraft, to smartphones (Pokémon GO), the Switch and
# a Nintendo theme park area. The used-game ruling of Japan's Supreme Court is included.
# Deep Blue and AlphaGo are in the AI collection and the Pokémon anime in the anime collection.
# The 1977 Color TV-Game 15 entry has year precision and is shown with its year only (the article gives 1 Jul 1977).
# Duplicates: the Game Boy (21 Apr 1989) and Pokémon Red and Green (27 Feb 1996) each appear twice; for the Game Boy
# the entry with the overseas dates is used, for Pokémon the plain one (the other's "best-selling RPG in the world" is
# not in the article). Super Mario Bros. appears on 13 Sep 1985 and 21 Sep 1985; the article gives 13 Sep.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: Tetris "date unknown" May 1985 / created in 1984; Doom released "in North America" on
# 10 Dec 1993 / released that day as MS-DOS shareware, not as a regional release; the PlayStation 2, 4 Mar 2000,
# appears twice, once with "about 980,000 sold in three days" / 600,000 in three days plus 380,000 online orders for
# two weeks ahead, and once with a leftover year-page cross-reference (後節「#ゲーム」も参照); the PlayStation 2 named
# a Future Technology Heritage on 3 Sep 2024 / the list article gives the 2024 round but no date).
slug: games
title: ゲームの歴史
lead: 1889年の任天堂骨牌の創業とセガの前身の設立から、日本初の家庭用テレビゲーム機「テレビテニス」、ゲーム&ウオッチとパックマン、ファミコンと『スーパーマリオブラザーズ』『ドラゴンクエスト』、ゲームボーイ、プレイステーション、そしてNintendo Switchまで。中古ゲームソフトの売買をめぐる最高裁判決やセガの家庭用ハードからの撤退、Minecraft、Pokémon GO、スーパー・ニンテンドー・ワールドの開業も含めて、ゲーム機とゲームソフトの移り変わりをたどる。
description: 任天堂骨牌の創業とセガの前身から、ファミコンとゲームボーイ、プレイステーション、Wii、Nintendo Switchまで、ゲーム機とゲームソフトの転換点を日本と世界の出来事で年代順にたどる特集。
icon: art-deep-blue
