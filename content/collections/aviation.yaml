# History of aviation (collection)
# References to existing auto-generated events only (nothing newly written).
# From airships and the first powered flights through ocean crossings, the jet age and supersonic travel,
# to Japan's airports, airlines and home-built airliners, including the major accidents.
# Left out on purpose: entries whose dataset wording disagrees with the topic article
# (the 15 Jul 1954 "Boeing 707 first flight" was the 367-80 prototype, the 707 itself first flew in 1957;
# Earhart's 1932 solo Atlantic flight is given as 14 h 54 min, the article says 14 h 56 min).
# Audited against the topic articles (2026-10-13): 31 entries checked, 7 corrected (5 in fixes.yaml, 1 in
# top50.yaml, 1 in tier2.yaml), none dropped. Corrected: Lindbergh's closing line, which had him make the Atlantic
# 「飛んで渡れる海」 although it had been flown nonstop in 1919 (チャールズ・リンドバーグ; the NC-4 entry here is from that year too),
# now his age, 25, from the article; Earhart in 1928, the first woman to cross the Atlantic by air, as a passenger
# (en "Amelia Earhart"), spelled イアハート as in the article; the Graf Zeppelin's arrival at Kasumigaura (the line used
# the non-word 向発); Earhart's disappearance on the way to Howland Island, a US island next to the Japanese mandate
# (the line said the area was under Japanese administration); JAL's first service, Tokyo-Osaka with a Martin 2-0-2
# and crew leased from Northwest (ja and en name different aircraft, so the name is left out, and neither gives
# Fukuoka); the YS-11, the first airliner developed in Japan after the war, not the first ever; Skymark's 運行 for 運航.
slug: aviation
title: 航空の歴史
lead: 1900年のツェッペリン飛行船、1903年のライト兄弟の初飛行から、リンドバーグの大西洋単独無着陸横断、世界初のジェット機、ジェット旅客機コメットとコンコルド、そして国産ジェット旅客機MRJの初飛行まで。羽田・成田・関西の空港の開港や国産旅客機YS-11、日本航空123便などの事故も含めて、空の旅が広がってきた歩みをたどる。
description: ライト兄弟の初飛行から国産ジェット旅客機の初飛行と羽田空港の衝突事故まで、飛行機と空の旅の転換点を日本と世界の出来事で年代順にたどる特集。
icon: art-wright-flyer
