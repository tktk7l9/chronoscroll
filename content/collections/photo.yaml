# History of photography and cameras (collection)
# References to existing auto-generated events only (nothing newly written).
# Film and the camera (Eastman's roll film and Kodak, Nikon and Fujifilm founded, Japan's first colour film, the
# disposable camera, the first LCD digital camera, the peak of film shipments), photographers and photojournalism
# (Draper's Orion Nebula, Capa, Nagai Kenji, Friday and the attack on its newsroom, the faked coral photo, the
# Mapplethorpe ruling), a planetary portrait by Voyager 1 and the photo booth.
# Le Prince's first film is in the cinema collection; Earthrise and the far side of the Moon are in the space
# collection and the black hole image in the science collection.
# Year-precision entries (Print Club, the film shipment record) are shown with their year only.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the first photographs of a meteor 27 Nov 1885, of an aurora 5 Jan 1892
# and Japan's oldest surviving star plate 5 Mar 1899 / not in the articles; Pluto first photographed 19 Mar 1915 / not
# in the article; Konica's photo school 17 Mar 1923, Asahi Camera Apr 1926, Land's polarizer 1929 and the Tokyo-Osaka
# photo telegraph 21 Aug 1930 / not dated in the articles; "Konica (then Konishiroku Photo Industry)" founded
# 22 Dec 1936 / the company founded that day was Konishiroku Honten; the Olympus, Canon, Sony and Konica products of
# 1954-1989 / the articles give the year only; the Nikon F on 1 Jun 1959 / Jun 1959; Focus founded 30 Oct 1981 /
# 23 Oct 1981; the Minolta α-7000 20 Feb 1985 / 1985 only; the Canon EOS 650 on 2 Mar 1987 / 1 Mar 1987; Konishiroku
# renamed Konica 1 Oct 1987 / 21 Oct 1987; Nippon Kogaku renamed Nikon 1 Apr 1988 / 1988 only; the Imperial Household
# Agency's Instagram account 1 Apr 2024 / "from April" only; the Emperor's photo with MacArthur published 29 Sep 1945
# / not dated in the articles).
slug: photo
title: 写真とカメラの歴史
lead: 1880年のオリオン大星雲の撮影、イーストマンのロールフィルムの特許とコダックの商標登録から、日本光学工業（現在のニコン）と富士写真フイルムの設立、国産初のカラーフィルム、写真家ロバート・キャパの死、写真週刊誌「フライデー」の創刊、レンズ付きフィルム「写ルンです」、液晶デジタルカメラ「QV-10」、プリクラの登場、写真フィルム出荷量のピークまで。フライデー襲撃事件や朝日新聞の珊瑚写真の自作自演、ボイジャー1号が撮った太陽系の写真、メイプルソープ写真集をめぐる最高裁判決も含めて、写真とカメラの歩みをたどる。
description: イーストマンのロールフィルムとコダックから、ニコンと富士写真フイルムの設立、「写ルンです」、デジタルカメラ「QV-10」、写真フィルム出荷量のピークまで、写真とカメラの節目を日本と世界の出来事で年代順にたどる特集。
icon: art-voyager
