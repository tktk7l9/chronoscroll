# History of music: recording, broadcasting and pop (collection)
# References to existing auto-generated events only (nothing newly written).
# Follows how music reached listeners (phonograph, records, radio, TV, Walkman, CD, iPod, downloads,
# a singing synthesizer) next to the pop milestones in Japan and abroad, with two concert-hall premieres.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: Berliner's gramophone patent granted 27 Sep 1887 / issued 8 Nov 1887; Caruso's first
# records 18 Mar 1902 / first sessions in April 1902; Nippon Polydor founded 9 May 1927 / 30 May 1927;
# Misora Hibari's singer debut 1 May 1948 / no debut date, a Yokohama stage show in May 1948;
# "Heartbreak Hotel" eight weeks at No. 1 / seven weeks on the Billboard Top 100; Sony's first transistor radio
# on sale 7 Aug 1955 / developed in August, shipped in September; first Japan Record Award chosen
# 15 Dec 1959 / that day only narrowed the field to six, ceremony on 27 Dec; the first CDs pressed at a Philips
# plant in the Netherlands on 17 Aug 1982 / a PolyGram plant in Langenhagen, West Germany).
slug: music
title: 音楽の歴史
lead: 1877年にエジソンが蓄音機で初めて声を録音してから、ジャズ初のレコード、ラジオ放送と紅白歌合戦、エルヴィスとビートルズ、ウォークマンとCD、iPodと初音ミク、そしてボブ・ディランのノーベル文学賞まで。録音と放送の技術の移り変わりと、それに乗って広がったポピュラー音楽の節目を、日本と世界の出来事でたどる。
description: エジソンの蓄音機からボブ・ディランのノーベル文学賞まで、録音と放送の技術、ポピュラー音楽の節目を日本と世界の出来事で年代順にたどる特集。
icon: art-turntable
entries:
