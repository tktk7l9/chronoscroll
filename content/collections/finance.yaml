# History of money systems and financial crises (collection)
# References to existing auto-generated events only (nothing newly written).
# Alternates the turning points of the monetary system (the yen, the Bank of Japan, the gold standard,
# Bretton Woods, 360 yen to the dollar, floating rates, the euro) with the panics and crises around them,
# in Japan and abroad.
# Left out on purpose: entries whose dataset wording disagrees with the topic article
# (the only Plaza Accord entry also says the yuan plunged, which the article does not support;
# Silicon Valley Bank is called the largest failure after Lehman, the article: second-largest FDIC-insured bank).
slug: finance
title: 金融危機の歴史
lead: 1871年の新貨条例で「円」が生まれてから、金本位制、昭和金融恐慌と世界恐慌、ブレトン・ウッズ協定と1ドル360円、ニクソン・ショックと変動相場制、1989年の日経平均株価の最高値と銀行・証券会社の破綻、リーマン・ショック、そして34年ぶりの最高値更新とマイナス金利の解除まで。市場を揺さぶった恐慌や金融危機を、通貨制度の転換点とあわせて、日本と世界の出来事でたどる。
description: 新貨条例による円の誕生からマイナス金利の解除まで、恐慌と金融危機を通貨制度の転換点とあわせて、日本と世界の出来事で年代順にたどる特集。
icon: art-great-depression
