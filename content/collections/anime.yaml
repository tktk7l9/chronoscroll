# History of anime (collection)
# References to existing auto-generated events only (nothing newly written). The ids are hashes of the text, so a
# monthly Wikipedia re-generation that changes the wording breaks them (the build flags it with a warning).
# Audited against the topic articles (2026-10-13): 25 entries checked, 7 corrected in fixes.yaml, 1 dropped.
# Corrected: 塙凹内名刀之巻 (Namakura-gatana), the oldest surviving Japanese animation whose maker and year are known, not
# simply the oldest; 桃太郎の海鷲, which 「日本初の長編アニメ映画といわれることがある」 (the line stated it as fact); Jungle Emperor, the first
# Japanese colour TV anime series (en "Kimba the White Lion"; テレビアニメ has the colour もぐらのアバンチュール on TV in 1958);
# Sazae-san, whose 「2025年現在も放送中」 is now its Guinness record as the longest-running animated TV programme; Nausicaä,
# made by Topcraft and only treated as a Ghibli film; Spirited Away's Academy Award, moved from 24 to 23 Mar 2003
# (千と千尋の神隠し and 第75回アカデミー賞; 24 Mar is the date in Japan); the Kyoto Animation arson, now 36 dead and 33 injured and
# the largest toll of any mass murder in Japan since Meiji, without the early count and the police quote that no
# article gives.
# Dropped: 1952-04-01-8ec1a77a 「この日発売の「少年」（光文社）にて、手塚治虫のSF漫画『鉄腕アトム』が連載開始」 (dataset vs article: 1 Apr 1952 / 鉄腕アトム
# gives the April 1952 issue, not the day it went on sale). The lead now calls Namakura-gatana one of the oldest
# surviving Japanese anime.
slug: anime
title: アニメの歴史
lead: 現存する最古級の国産アニメ「なまくら刀」から、テレビアニメの発明、世界名作劇場、ガンダム、ジブリ、そして興行収入記録を塗り替えた劇場版まで。
description: 1917年の「なまくら刀」から『劇場版「鬼滅の刃」無限列車編』まで、日本のアニメーション100年の転換点を年代順にたどる特集。
icon: art-collection-anime
