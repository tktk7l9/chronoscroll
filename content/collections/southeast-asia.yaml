# Modern Southeast Asia (collection)
# References to existing auto-generated events only. Rama V and the Philippine revolution; the Siamese revolution of
# 1932; the fall of Singapore; independence in Indonesia, Vietnam, the Philippines and Burma; Dien Bien Phu and Bandung;
# the Burmese coup, Tonkin, Singapore's separation, the 30 September Movement and ASEAN; Tet, the Cambodian coup, the US
# withdrawal, the fall of Saigon and the Sino-Vietnamese War; Aquino, Brunei and the EDSA revolution; Japan's first PKO in
# Cambodia, the Asian financial crisis, Suharto, East Timor, Lee Kuan Yew, Myanmar's 2015 election and Rama IX. 2026-11-02.
# Overlaps: the fall of Singapore is in ww2, the fall of Saigon in cold-war, the Asian crisis in finance.
# Left out on purpose (dataset vs article): the Republic of Vietnam 28 Oct 1955 / 26 Oct 1955; Sukarno president
# 16 Dec 1949 and the Diem coup entry with its detail on Madame Nhu / not confirmed in the articles; the Katipunan rising
# "23 Aug" 1896, Vietnam-US normalisation 5 Aug 1995 and the Cambodia Paris Agreements 23 Oct 1991 / not dated, or no topic
# article found; the 2006 Thai coup entry / its detail on the emergency decree was not confirmed.
slug: southeast-asia
title: 東南アジアの近現代
lead: シャムのラーマ5世の即位とフィリピン独立宣言から、タイ立憲革命、シンガポールの陥落、インドネシア独立宣言、ベトナム民主共和国の成立、ビルマの独立、ディエンビエンフーの戦い、バンドンのアジア・アフリカ会議、ASEANの結成、テト攻勢、サイゴン陥落、エドゥサ革命、自衛隊のカンボジア派遣、アジア通貨危機、スハルトの辞任、東ティモールの独立まで。東南アジアの150年余りをたどる。
description: タイ立憲革命とインドネシア独立宣言から、ベトナム戦争、ASEANの結成、エドゥサ革命、アジア通貨危機、東ティモールの独立まで、東南アジアの近現代を年代順にたどる特集。
