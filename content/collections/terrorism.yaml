lead: 1972年のテルアビブ空港乱射事件とミュンヘンオリンピック事件から、ラングーン事件、エア・インディア182便とパンアメリカン航空103便の爆破、松本サリン事件と地下鉄サリン事件、オクラホマシティ連邦政府ビル爆破事件、ケニアとタンザニアのアメリカ大使館爆破、米艦コール襲撃、アメリカ同時多発テロ、バリ島の爆弾テロ、ベスラン学校占拠事件、ロンドン同時爆破、ムンバイ同時多発テロ、ビンラディンの殺害、ノルウェー連続テロ、ボストンマラソン爆弾テロ、「シャルリー・エブド」本社の銃撃とパリ同時多発テロ、ブリュッセルとダッカの事件、マンチェスター・アリーナの爆破まで。1972年から2017年まで、世界各地で起きたテロ事件をたどる。
