# Terrorism (collection)
# References to existing auto-generated events only (nothing newly written). The Lod airport massacre, the Munich
# Olympics, the Rangoon bombing, Air India 182 and Pan Am 103; the Matsumoto and Tokyo subway sarin attacks,
# Oklahoma City, the embassy bombings in Kenya and Tanzania and the USS Cole; 11 September, Bali, Beslan and London;
# the Mumbai attacks, the killing of bin Laden and the attacks in Norway; Boston, Charlie Hebdo, Paris, Brussels,
# Dhaka and Manchester.
