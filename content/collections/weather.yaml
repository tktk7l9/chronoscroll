# History of weather observation and forecasting (collection)
# References to existing auto-generated events only (nothing newly written).
# The weather services (the US Weather Bureau, the Tokyo Meteorological Observatory and its successors up to the Japan
# Meteorological Agency, the WMO), the first weather maps and forecasts, the records (Asahikawa -41.0°C, the 11.82 m
# of snow on Mount Ibuki, the record highs from Yamagata to Kumagaya and Hamamatsu), the observation posts (Mount
# Tsukuba, Mount Fuji), the Himawari satellites, the forecaster licence, and the forecast products of the 2020s
# (the heatstroke alert, the end of the "177" telephone forecast, the word 酷暑日, the reorganised warnings).
# Entries that belong to the disaster collection are not repeated: the first weather map of 16 Feb 1883, AMeDAS
# (1974), the emergency earthquake warning, the special warnings and the five-level alert; the Vostok record low is in
# the exploration collection. Storms and floods as disasters are left to that collection.
# The two 酷暑日 entries of 17 Apr 2026 are duplicates; the one that says the agency announced its decision is used.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: Cloncurry's 53°C on 16 Jan 1889 / not in the article; the Tohoku crop
# failure of 1913 / not dated in the article; Basra's 53.8°C, Jul 1921, keeps a year-page residue (7月15日・17日 -);
# the radio forecast resumed on 22 Aug 1945 / 17 Aug 1945 in ja:天気予報; the Mount Fuji radar completed 1 Oct 1964 /
# the article gives 1964 only, and its observation started 10 Mar 1965 / the article has only a commemorative stamp on
# that day; Tokyo rain forecasts from 1 Jun 1980, the 2003 French heatwave toll on 29 Aug 2003, Baghdad's snow on
# 11 Jan 2008, Tokyo's latest first snow on 16 Mar 2007, the Kanto rainy season ending 29 Jun 2018, the new climate
# normals of 19 May 2021, Tokyo's nine straight 猛暑日 on 3 Jul 2022, the hottest summer of 3 Sep 2024 and the
# weather law amendment of 5 Dec 2025 / not dated in the articles; the half-day linear rainband information from
# 27 May 2024 / 28 May 2024 in the article).
slug: weather
title: 気象と天気予報史
lead: 1870年のアメリカの気象局の設立と1875年の東京気象台の設置、天気図の発行開始と日本初の天気予報、旭川の氷点下41.0度と伊吹山の積雪11メートル82センチ、富士山頂の気象観測所から、気象庁の発足、気象衛星「ひまわり」の打ち上げ、初の気象予報士試験、熊谷と浜松の41.1度、「酷暑日」の決定と防災気象情報の再編まで。世界気象機関の発足や1888年の大ブリザード、天気予報の電話サービス「177」の終了も含めて、空を観測し予報してきた歩みをたどる。
description: 東京気象台の設置と日本初の天気予報から、気象庁の発足、気象衛星「ひまわり」、国内最高気温の更新、「酷暑日」の決定まで、気象観測と予報の節目を日本と世界の出来事で年代順にたどる特集。
icon: art-sputnik
