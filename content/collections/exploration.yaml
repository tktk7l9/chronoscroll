# History of exploration and adventure (collection)
# References to existing auto-generated events only (nothing newly written).
# Exploration other than space: the oceans (the Challenger expedition, the Kon-Tiki raft, the Nautilus under the
# North Pole, the Titan submersible), unknown lands (the Kurils, Vulture Peak, Machu Picchu), the poles (the race
# for the South Pole, Japan's Antarctic stations and the Antarctic Treaty) and the high mountains (the first ascents
# of the 8,000 m peaks, the Alpine north faces and the Japanese climbers who followed).
# Flights (Lindbergh, Earhart) are in the aviation collection and spaceflight in the space collection.
# Duplicates: Uemura Naomi's Arctic dog-sled journey appears on 8 and 9 May 1976; the 8 May entry matches the article.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: Stanley greets Livingstone with "Dr. Livingstone, I presume?" on 10 Nov 1871 / the date is
# right, but en:Henry Morton Stanley says the line is likely his later invention; Scott, Wilson and Shackleton reach
# 82°17'S on 31 Dec 1902 / 30 Dec 1902; Peary "reaches the North Pole" on 6 Apr 1909 / he reached the spot he took
# for the pole and was probably a few miles short; the airship Italia "crashes near the North Pole" on 24 May 1928 /
# it reached the pole on the 24th and crashed on the 25th; Byrd leaves New York for Antarctica on 1 Sep 1928 / no
# such date in the articles; Andrée's remains found on 22 Aug 1930 / 5 Aug 1930; Japan's wintering party "lands on
# the Antarctic continent" on 29 Jan 1957 / the landing that named Showa Station was on East Ongul Island; Horie
# Ken'ichi's solo Pacific crossing, 12 Aug 1962, has the right date but its summary carries the typo 堀江謙一がの;
# the Titanic wreck found by a 合同捜査チーム on 1 Sep 1985 / the article has a research team (調査団), not a
# criminal-investigation team; Tabei Junko the first woman on the highest peaks of six continents on 19 Jan 1991 / no
# such date, she completed the seven summits on 28 Jun 1992; Imakiire Noriko's non-stop circumnavigation completed on
# 15 Jul 1992 / 5 Jul 1992; Minamiya Marin "the first Japanese" to complete the Explorers Grand Slam on 13 Apr 2017 /
# the article says the youngest in the world, and the list article gives 12 Apr; the deepest fish recognised by
# Guinness on 4 Apr 2023 / no such date in the articles).
# Not used: Tokai University's K2 ascent of 1 Aug 2006 (the article gives the date but not "five of the six members").
slug: exploration
title: 探検と冒険の歴史
lead: 1872年のチャレンジャー号の探検航海、白瀬矗の南極探険とアムンセン、スコットの南極点到達から、コンティキ号の航海、エベレスト初登頂と日本登山隊のマナスル初登頂、原子力潜水艦ノーチラスの北極点海中通過まで。タロとジロの生存確認や日本人初の南極点到達、田部井淳子と植村直己、三浦雄一郎の挑戦も含めて、極地と高山と海に挑んだ人々の足跡をたどる。
description: チャレンジャー号の探検航海と南極点到達の競争から、ヒマラヤの高峰の初登頂、日本人登山家の挑戦、北極点への到達まで、探検と冒険の節目を日本と世界の出来事で年代順にたどる特集。
