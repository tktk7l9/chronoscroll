# History of baseball and football (soccer) (collection)
# References to existing auto-generated events only (nothing newly written).
# Japan's two big team sports outside the Olympics: the school tournament, Koshien and the professional league,
# Nagashima and Oh, the Japanese players in the major leagues and the World Baseball Classic; FIFA and the World Cup,
# the J.League, the road to Japan's first World Cup, the 2002 World Cup and the women's world title.
# Olympic tournaments are left out (the olympics collection covers the Games).
# Duplicates: of the two Koshien entries the 1 Aug 1924 one is used (the article gives the opening as 1 Aug 1924);
# of the two 2011 Women's World Cup entries the tournament entry dated 26 Jun is used (see below).
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: Murakami Masanori "promoted to the majors" 31 Aug 1964 / the article puts his call-up and
# major-league debut on 1 Sep 1964; Ichiro sets the record of 262 hits on 1 Oct 2004 / that day he broke Sisler's
# record with his 258th hit, 262 was his season total; the Women's World Cup final dated 18 Jul 2011 and Japan's win
# over Spain dated 2 Dec 2022 / played on 17 Jul and 1 Dec, the dataset gives the Japanese date without saying so;
# Japan's win over Germany, 23 Nov 2022, has the right date but its summary carries the typo 選出時代 for 選手時代,
# copied from the year page).
slug: baseball-soccer
title: 野球とサッカー史
lead: 1915年の第1回全国中等学校優勝野球大会と甲子園球場の竣工、ベーブ・ルースらの来日と職業野球の発足、天覧試合と王貞治の756号、野茂英雄とイチローの大リーグでの活躍、そして2023年のワールド・ベースボール・クラシック優勝まで。国際サッカー連盟の創立と第1回ワールドカップ、Jリーグの開幕、ジョホールバルの歓喜でのワールドカップ初出場、日韓共催のワールドカップ、サッカー日本女子代表の女子ワールドカップ優勝も含めて、二つの球技の歩みを日本と世界の出来事でたどる。
description: 第1回全国中等学校優勝野球大会と職業野球の発足からWBC優勝まで、国際サッカー連盟の創立とワールドカップからJリーグ、日韓共催のワールドカップまで、野球とサッカーの節目を年代順にたどる特集。
icon: art-world-cup
