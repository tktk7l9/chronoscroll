# COVID-19 (collection)
# References to existing auto-generated events only (nothing newly written). The identification of the virus in
# Wuhan, the first case in Japan, the charter flights from Wuhan, the school closures, the WHO pandemic statement,
# the postponement of the Tokyo Olympics and the deaths of Shimura Ken and Okae Kumiko; the first state of emergency
# and its end, Go To Travel and its suspension and Sputnik V; the second and third states of emergency, the first
# vaccinations in Japan and the torch relay; Omicron, the priority measures of January 2022, Xocova and China's
# easing; the end of the WHO emergency and the move to Class 5.
# Checked against en: Sputnik V as the first registered vaccine (11 Aug 2020, "Sputnik V COVID-19 vaccine").
# Overlaps: the identification of the virus, the pandemic statement, the first vaccinations and the move to Class 5
# are also in the medicine collection; the postponement of the Olympics is also in the Olympics collection.
# The first case in Japan appears twice and the entry of 15 Jan 2020 (the date in the main ja article) is used.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the Wuhan announcement 31 Dec 2019 "by the city's CDC" / by the Wuhan
# Municipal Health Commission; the PHEIC 31 Jan 2020 / declared 30 Jan; the designated infectious disease 1 Feb 2020
# "forced hospitalisation" / not in the articles; the first death in Japan 13 Feb 2020 "a Kanagawa woman in her 80s"
# / not in the articles; the first deaths from the Diamond Princess 20 Feb 2020 "the news went round the world" /
# not in the article; the amended special measures law 13 Mar 2020 "passed with the CDP and the DPFP" / the parties
# are not in the articles; the reopening of Wuhan 8 Apr 2020, Go To Travel without Sapporo and Osaka 24 Nov 2020,
# the 50% second-dose mark 13 Sep 2021 and the border reopening 11 Oct 2022 / not dated in the articles; the
# 100,000-yen payment 20 Apr 2020 "subcontracted to Dentsu" / that story belongs to the business continuity subsidy;
# remdesivir 7 May 2020 "approved in two months instead of a year" / not in the article; 50 million cases 9 Nov 2020
# / 8 Nov, and the line has lost its country names; the Olympics without spectators 9 Jul 2021 / decided on 8 Jul;
# the end of the priority measures (two entries, 21 and 22 Mar 2022) / the articles give only the last day of the
# period; the border measures of 7 Sep 2022 / only the third-dose rule is in the articles; masks left to individuals
# 13 Mar 2023 / the situations where masks stay recommended are not in the articles).
slug: covid19
title: 新型コロナウイルス
lead: 2020年1月の武漢市での新型コロナウイルスの特定と日本での初確認から、武漢からのチャーター便による帰国、全国の小中高校の一斉臨時休校、WHOのパンデミック宣言、東京オリンピック・パラリンピックの延期、志村けんと岡江久美子の死去、初の緊急事態宣言とその解除、Go To トラベルの開始と一斉停止、2度目と3度目の緊急事態宣言、国内初のワクチン接種、オミクロン株の市中感染、ゾコーバの緊急承認、WHOの緊急事態宣言終了と5類への移行まで。スプートニクVの承認や中国の対策の大幅緩和も含めて、新型コロナウイルス感染症の流行の3年余りをたどる。
description: 武漢での新型コロナウイルスの特定と日本での初確認から、一斉臨時休校、パンデミック宣言、東京五輪の延期、緊急事態宣言、ワクチン接種の開始、オミクロン株、5類への移行まで、新型コロナウイルスの流行を年代順にたどる特集。
