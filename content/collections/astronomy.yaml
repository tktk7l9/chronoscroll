# History of astronomy (collection)
# References to existing auto-generated events only (nothing newly written). Helium in the solar spectrum, the moons
# of Mars, the Great Comet of 1882 and Holmes's comet; Tunguska, the eclipse of 1919 and Hubble's galaxies; Pluto,
# the Kasamatsu and Sikhote-Alin meteorites, Miranda and Nereid; Ikeya-Seki, the Arecibo message, the rings of
# Uranus and the Wow! signal; SN 1987A, the Hubble Space Telescope, Shoemaker-Levy 9 and 51 Pegasi b; Pluto
# reclassified, the annular eclipse of 2012, Chelyabinsk and comet ISON; gravitational waves, the American eclipse
# of 2017, the first image of a black hole and the James Webb Space Telescope.
# Checked against en: the Arecibo message (16 Nov 1974, "Arecibo message"), the announcement of gravitational waves
# by LIGO and Virgo (11 Feb 2016, "First observation of gravitational waves") and the eight telescopes behind the
# black hole image ("Event Horizon Telescope").
# Overlaps: helium, the discovery of Pluto, SN 1987A, 51 Pegasi b, gravitational waves and the black hole image are
# also in the science collection; the Hubble and James Webb telescopes in the space collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date or
# details the articles cannot confirm (dataset vs article: the eclipse of 19 Aug 1887 「白河日食」「東京でも99％」 / not in the
# article; Halley's comet 19 May 1910 「欧米では18日」 / the articles give 19 May only; Honda's comet 14 Nov 1947 /
# discovered 13 Nov; Palomar completed 3 Jun 1948 / 1948 only; the eclipse of 21 Jul 1963 "from Daisetsuzan through
# Kamchatka to the Bering Sea" / the article has Hokkaido, the Kurils, Alaska, Canada and Maine; the eclipse of 22
# Jul 2009 "the Tokara Islands, where the totality was to be the longest on an inhabited island" / not in the
# article; TRAPPIST-1 22 Feb 2017 「39光年」 / about 40.5 light years; comet Borisov 28 Dec 2019 / not dated in the
# article).
slug: astronomy
title: 天文学の歴史
lead: 1868年の日食観測で見つかったヘリウムの輝線から、火星の衛星ダイモスとフォボスの発見、1882年の大彗星、ホームズ彗星、ツングースカ大爆発、1919年の日食、ハッブルによる系外銀河の発見、冥王星の発見、笠松隕石とシホテアリニ隕石、天王星の衛星ミランダと海王星の衛星ネレイド、池谷・関彗星、アレシボ・メッセージ、天王星の環、Wow! シグナル、超新星SN 1987A、ハッブル宇宙望遠鏡の打ち上げ、シューメーカー・レヴィ第9彗星の木星衝突、初の太陽系外惑星、冥王星の準惑星への分類、2012年の金環日食、チェリャビンスク州の隕石落下、アイソン彗星、重力波の直接検出、2017年のアメリカの皆既日食、ブラックホールの撮影、ジェイムズ・ウェッブ宇宙望遠鏡の打ち上げまで。日食や彗星、隕石から宇宙望遠鏡まで、天文学の150年余りをたどる。
description: ヘリウムの輝線と火星の衛星の発見から、冥王星の発見、シューメーカー・レヴィ第9彗星、初の太陽系外惑星、重力波、ブラックホールの撮影まで、天文学の発見と天体現象を年代順にたどる特集。
icon: art-comet-jupiter
