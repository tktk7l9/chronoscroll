# Disasters and disaster preparedness in Japan (collection)
# References to existing auto-generated events only (nothing newly written).
# The disasters are interleaved with the systems built to reduce their toll
# (weather maps, AMeDAS, Earthquake Early Warning, emergency warnings, alert levels, relief law).
# Left out on purpose: entries whose wording goes beyond the topic article
# (the 1947 Typhoon Kathleen entry says it made landfall; the article has it passing the tip of Boso).
slug: disaster
title: 日本の災害と防災の歴史
lead: 1883年に日本で初めて作られた天気図から、関東大震災、伊勢湾台風、阪神・淡路大震災、東日本大震災、そして能登半島地震まで。地震・津波・台風・噴火の記録に、緊急地震速報や特別警報のように被害を減らすために生まれた仕組みを重ねてたどる。
description: 日本初の天気図から能登半島地震まで、日本を襲った地震・津波・台風・噴火と、被害を減らすために整えられてきた防災の仕組みを年代順にたどる特集。
icon: art-kanto-earthquake
