# History of Okinawa (collection)
# References to existing auto-generated events only (nothing newly written). The killing of Ryukyuan castaways in
# Taiwan (1871) and the Ryukyu disposition that made Okinawa a prefecture, the death of the last king Sho Tai; the
# Battle of Okinawa (from the Kerama landing and the main island landing to Ushijima's suicide); American rule (the
# University of the Ryukyus, the Government of the Ryukyu Islands, Shuri High School at Koshien, Sato's visit, the
# Koza riot), the reversion agreement and the reversion of 1972; the Ocean Expo, the switch to left-hand traffic
# ("730"); the 1995 rape case and the protest rally, the agreement to return Futenma, the Okinawa summit and the
# 2,000-yen note, the Churaumi aquarium, the Yui Rail, the helicopter crash at Okinawa International University,
# Hatoyama's visit, the approval of the Henoko landfill, the elections of Onaga and Tamaki, the Shuri Castle fire and
# the start of its rebuilding.
# Shuri High School's appearance at Koshien (Aug 1958) is a month entry and is shown with its month only. The killing of
# the castaways appears twice (a year entry 1871-01-01-b402e268 and the dated entry, whose date prefix is corrected in
# content/curated/fixes.yaml); the dated one is used.
# Overlaps: the start of the Battle of Okinawa is also in the World War II collection, the Ryukyu disposition in the
# Meiji Restoration collection and the Ocean Expo in the expositions collection.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: conscription extended to Okinawa 1 Jan 1898 / January 1898 only; the
# Emperor's message on Okinawa 20 Sep 1947 / no article states it; the Miyamori school jet crash "100 injured" / 210
# injured; Yara elected chief executive 10 Nov 1968 / the articles give 1 Dec (election) and 15 Nov (took office); the
# Sato-Nixon joint statement 21 Nov 1969 / November 1969 only; the Okinawa rail found 13 Nov 1981 / caught in Jun-Jul
# 1981, the announcement is not dated; Shuri Castle restored 3 Nov 1992 / 1992 only; the Emperor's first visit 23 Apr
# 1993 / 1993 only; the 50th anniversary ceremony of the reversion 15 May 2022 / not in the article).
slug: okinawa
title: 沖縄の歴史
lead: 1871年の琉球島民殺害事件と1879年の琉球処分による沖縄県の設置から、沖縄戦と牛島満の自決、琉球大学の開学と琉球政府の発足、首里高校の甲子園出場、コザ市での暴動、沖縄返還協定と1972年の本土復帰、沖縄国際海洋博覧会、730と呼ばれた交通ルールの変更、米兵による少女暴行事件と県民総決起大会、普天間飛行場の返還合意、沖縄サミットと守礼門の二千円札、ゆいレールの開業、辺野古の埋め立て承認、首里城の焼失と再建の起工式まで。沖縄の近現代をたどる。
description: 琉球処分と沖縄県の設置から、沖縄戦、アメリカ統治と本土復帰、普天間飛行場などの基地問題、沖縄サミット、首里城の焼失と再建まで、沖縄の近現代を年代順にたどる特集。
icon: art-okinawa-return
