# History of AI and computing (collection)
# Fills in milestones that the Wikipedia year pages do not carry. Every entry except Deep Blue (1997-05-11-d05df6c0,
# an auto-generated event whose title and summary are set here) is written here: an entry with date, title and
# summary becomes a new event through applyCurated.
# Audited against the topic articles (2026-10-13): 41 entries checked, 28 corrected here, none dropped. Sources that
# pointed to ja articles that do not exist were replaced (ダートマス会議 (人工知能), AlphaGo対李世乭, 人工知能の規制 twice, Sora (人工知能)),
# and the article that gives the date was added where the listed ones did not (Turing's paper in October 1950,
# Google, Facebook, Twitter, DALL-E 2, Midjourney, Stable Diffusion).
# Dates as the articles give them: the Dartmouth workshop in July-August 1956 (ja ダートマス会議; the line had June),
# AlexNet's win at ILSVRC 2012 on 30 Sep 2012 (ja AlexNet; the line had October), the Hiroshima AI Process launched
# in the leaders' communiqué of 20 May 2023 (ja 広島AIプロセス); GAN (June 2014), BERT (October 2018) and the pause letter
# (March 2023) now carry only the month the articles give.
# Facts corrected: ELIZA's model was a Rogerian therapist and some users read feelings into it (the ELIZA effect);
# Deep Blue won the 1997 match with two wins, one loss and three draws, the first match a world champion lost to a
# computer under tournament rules; Google's line keeps its mission statement instead of the claim that it set the
# shape of the internet; Facebook had 800 million users in 2011 (not "nearly half the world"); Watson beat two
# former champions, not the strongest of all time; AlphaGo's match began on 9 March and ended 4-1 on the 15th; the
# Transformer led to BERT and GPT (not to all large language models); AlphaFold 2 scored GDT above 90 on about
# two-thirds of the CASP14 targets (the line said it solved the problem); Lemoine was put on leave, not suspended;
# GPT-4's bar exam result without the quoted reception; LLaMA's weights leaked on 2 Mar 2023; the pause letter has
# more than 30,000 signatures (the line said 1,000); the Tokyo office Altman was said to announce in April 2023 is
# in no article (ja ChatGPT has the meeting with Kishida); o1's maths result was on AIME, not the Olympiad; the 2024
# Nobel chemistry prize is now "the same year", not "the next day"; DeepSeek wiped 589 billion dollars off Nvidia
# (ja DeepSeek; the line had about 600 billion); the Paris summit, where the US and UK refused to sign the
# declaration (en "AI Action Summit").
# Dates kept on purpose: Midjourney's open beta on 12 Jul 2022 (en "Midjourney"; ja gives 13 Jul for the
# announcement). The lead no longer names personal computers, which no entry covers.
slug: ai-tech
title: AI・コンピューティングの歴史
lead: 「機械は考えることができるか」という1950年の問いから、ダートマス会議、インターネット、ディープラーニング、そして生成AIまで。
description: チューリングの問いからChatGPTの登場まで、人工知能とコンピューティングを形づくった転換点を年代順にたどる特集。
icon: art-turing
