# History of the Cold War (collection)
# References to existing auto-generated events only (nothing newly written).
# From the "Iron Curtain" speech, the Marshall Plan and NATO through Korea, Hungary, Prague and the Berlin Wall
# to perestroika, the Malta summit and the end of the Soviet Union, with Japan's own steps
# (the police reserve, the Japan-Soviet declaration, the 1960 security treaty).
# The Cuban Missile Crisis, the test-ban and arms-control treaties belong to the nuclear collection and are not repeated.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article
# (dataset vs article: Reagan's "evil empire" phrase said in the State of the Union, 8 Mar 1983 / in a speech to the
# National Association of Evangelicals in Orlando; the Velvet Revolution "brings down the communist government" on
# 24 Nov 1989 / the revolution began on 17 Nov and on the 24th the party leadership resigned, Havel became president on
# 29 Dec; Solidarity takes over 99% of the seats in both houses in the first round of 4 Jun 1989 / that result came
# after the second round, so the 18 Jun entry is used; the San Francisco Peace Treaty and Security Treaty "in force six
# months later" / in force on 28 Apr 1952; the San Francisco peace conference "until 4 Sep" 1951 / held 4-8 Sep;
# West Germany "officially founded" 7 Sep 1949 / 23 May 1949; the 3 Jun 1961 Vienna summit entry starts with a stray
# "4日 -").
slug: cold-war
title: 冷戦の歴史
lead: 1946年のチャーチルの「鉄のカーテン」演説から、マーシャル・プランとNATOの発足、ベルリン封鎖と朝鮮戦争、ハンガリー動乱やプラハの春、ベルリンの壁の建設と崩壊、マルタ会談での冷戦終結の宣言、そして1991年のソビエト連邦の崩壊まで。警察予備隊の創設要求や日ソ共同宣言、新安保条約の調印といった日本の動きも含めて、冷戦の始まりから終わりまでをたどる。
description: チャーチルの「鉄のカーテン」演説からベルリンの壁の崩壊、ソビエト連邦の崩壊まで、冷戦の転換点を日本と世界の出来事で年代順にたどる特集。
icon: art-berlin-wall
