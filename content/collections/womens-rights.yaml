# History of women's suffrage and rights (collection)
# References to existing auto-generated events only (nothing newly written).
# Follows the vote, then public office, then rights at work, in marriage and over one's own body,
# setting Japan beside other countries.
# Left out on purpose: entries whose dataset date disagrees with the topic article
# (the 1908 New York march, Bandaranaike's 1960 premiership, Doi Takako becoming JSP chair in 1986,
# the 1999 Basic Act for a Gender-Equal Society listed as "passed" on its promulgation date).
slug: womens-rights
title: 女性の権利の歴史
lead: 1893年にニュージーランドで成立した世界初の女性参政権から、『青鞜』と新婦人協会、39人の女性議員が誕生した1946年の総選挙、男女雇用機会均等法、そして日本初の女性首相まで。投票し、議席に就き、働き、自分の体について決める権利をめぐる各国の歩みを、日本の動きと並べてたどる。
description: ニュージーランドの女性参政権から日本初の女性首相の誕生まで、女性が参政権と法的な権利を求めてきた歩みを年代順にたどる特集。
icon: art-human-rights
