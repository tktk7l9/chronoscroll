# The Russo-Ukrainian War (collection)
# References to existing auto-generated events only (nothing newly written). The annexation of Crimea, Poroshenko's
# inauguration and the shooting down of MH17; the full-scale invasion, the first talks, the UN General Assembly
# resolution and Zelensky's speech to the Japanese Diet; the sinking of the cruiser Moskva, the annexation of four
# regions and the missile that fell in Poland; Soledar, Biden in Ukraine, the ICC warrant for Putin, Kishida in
# Ukraine and Zelensky at the G7 in Hiroshima; the Kakhovka dam, the Wagner mutiny and Prigozhin's death.
# Checked against en: "the largest and deadliest war in Europe since World War II" (24 Feb 2022, "Russian invasion
# of Ukraine") and the missile in Poland (15 Nov 2022, "2022 missile explosion in Poland"). The sinking of the
# Moskva (14 Apr 2022) is included with the wording corrected in fixes.yaml (2026-10-13) after en "Russian cruiser
# Moskva".
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the agreement of 21 Feb 2014 "77 dead" and the events of the
# following days / not in the article; Putin recognises the separatist republics 21 Feb 2022 "and the US imposes
# sanctions with Germany and France" / not in the articles; SWIFT 26 Feb 2022 / not dated in the articles; Bucha 1
# Apr 2022 "AFP finds 20 bodies and a grave of about 280" / the reporters entered after the liberation was announced
# on 2 Apr and the 280 is not in the article; Japan's condemnation 4 Apr 2022 / not in the article; the strike on
# Sevastopol 13 Sep 2023 "the first submarine lost in combat since World War II" / not in the articles; the Kursk
# incursion 11 Aug 2024 and ATACMS 19 Nov 2024 / not dated in the articles; Trump and Zelensky in the Oval Office 28
# Feb 2025 / the line's account of the meeting is not in the articles; Operation Spiderweb 1 Jun 2025 "over 40
# bombers destroyed" / 41 aircraft hit by Ukraine's count).
slug: russia-ukraine
title: ロシア・ウクライナ戦争
lead: 2014年のロシアによるクリミアの併合、ポロシェンコ大統領の就任、マレーシア航空17便撃墜事件から、2022年のロシア軍によるウクライナ各地への攻撃、国連緊急特別総会での非難決議、ゼレンスキー大統領の日本の国会でのオンライン演説、黒海艦隊旗艦モスクワの沈没、4州の併合条約への署名、ポーランドへのミサイル着弾、ソレダルの戦い、バイデン大統領のウクライナ訪問、国際刑事裁判所によるプーチン大統領への逮捕状、岸田首相のウクライナ訪問と広島でのG7へのゼレンスキー大統領の来日、カホフカダムの決壊、ワグネル・グループの武装蜂起とプリゴジンの死まで。日本との関わりも含めて、ロシア・ウクライナ戦争の10年近くをたどる。
description: クリミアの併合とマレーシア航空17便撃墜事件から、ロシアのウクライナ侵攻、4州の併合、ゼレンスキー大統領の来日、カホフカダムの決壊、ワグネル・グループの武装蜂起まで、ロシア・ウクライナ戦争を年代順にたどる特集。
