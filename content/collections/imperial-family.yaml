# The imperial family (collection)
# References to existing auto-generated events only (nothing newly written). Crown Prince Yoshihito's investiture
# and wedding and the death of Emperor Meiji; Hirohito's regency, wedding, accession and enthronement; the departure
# of the eleven collateral houses; Akihito's investiture, engagement and wedding and the birth of Naruhito; Prince
# Hitachi's wedding, the pachinko-ball attack on Hirohito and his visit to the United States; the end of Showa and
# the state funeral; Prince Akishino's wedding, Akihito's enthronement and his visit to China; Naruhito's
# investiture and wedding; the births of Princess Aiko and Prince Hisahito and Princess Sayako's wedding; Akihito's
# video message, the date of the abdication, the abdication and the start of Reiwa; Naruhito's enthronement,
# Akishino's investiture as heir, Princess Mako's wedding, Aiko coming of age and Hisahito's coming-of-age ceremony.
# Overlaps: the death of Taisho, the end of Showa and the start of Reiwa are also in the calendar collection (the
# same entries).
# Hisahito "the first boy in 41 years" (6 Sep 2006): the article has 40 years and 9 months; kept as the rounded
# figure.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: Meiji's silver wedding 9 Mar 1894 "silver weddings spread in Japan" /
# not in the article; Taisho's funeral 7 Feb 1927 "137,669 amnestied" / the numbers are not in the article;
# Akihito's birth 23 Dec 1933 "the siren sounded twice" / not in the articles; Akihito at the coronation of
# Elizabeth II 2 Jun 1953 "talks with President Eisenhower" / not in the articles; Hirohito's European tour 27 Sep
# 1971 "seven countries including Switzerland" / the articles name six; the long entry on the death of Showa 7 Jan
# 1989 "TV stations cancelled their programmes until the 9th" / not in the articles, the shorter entry of the same
# day is used; Akihito in Palau 8 Apr 2015 / not dated in the article).
slug: imperial-family
title: 皇室
lead: 1889年の嘉仁親王の立太子礼から、明治天皇の崩御、裕仁親王の摂政就任と即位の礼、11宮家51人の皇籍離脱、明仁親王と正田美智子の婚約とミッチー・ブーム、昭和天皇の初の訪米、昭和の終わりと大喪の礼、天皇明仁の即位礼正殿の儀と初の中国訪問、皇太子徳仁親王と小和田雅子の結婚、愛子内親王と悠仁親王の誕生、天皇の退位と令和の始まり、天皇徳仁の即位礼正殿の儀、立皇嗣の礼、眞子内親王の結婚、悠仁親王の成年式まで。明治から令和まで、天皇と皇族の誕生・結婚・即位・崩御をたどる。
description: 嘉仁親王の立太子礼から、明治・大正・昭和の天皇の崩御と即位、皇太子明仁親王の結婚、平成の即位と天皇の退位、令和の始まり、悠仁親王の成年式まで、皇室の歩みを年代順にたどる特集。
