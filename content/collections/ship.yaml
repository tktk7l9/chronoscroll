# History of ships and shipping (collection)
# References to existing auto-generated events only (nothing newly written).
# Lighthouses and canals (Kannonzaki, Suez, Panama, the St. Lawrence Seaway), shipping lines and ferries (NYK, the
# Kanpu and Seikan ferries, Sakurajima, Hankyu Ferry), emigrant ships, the great wrecks (Titanic, Toya Maru, Shiun
# Maru, Estonia, Costa Concordia, Sewol, the Shiretoko tour boat), the oil spills and the collisions (Yuyo Maru No. 10,
# Nakhodka), the Suez nationalisation and the 2021 blockage, the solo and family voyages under sail (Horie Ken'ichi,
# the Nagae family), the nuclear ship Mutsu, the discovery of the Titanic wreck, the world's largest cruise ship and
# the first Arctic container voyage from China to Europe.
# The Challenger expedition and the Titan submersible are in the exploration collection and the SOS adoption of 1906 in
# the telecom collection; Tsushima Maru is in the education collection (school evacuation); naval warfare is not here.
# Duplicates: the Toya Maru disaster appears twice on 26 Sep 1954 and the launch of Mutsu twice on 12 Jun 1969; the
# detailed entry of each is used.
# Left out on purpose: entries whose dataset date or wording disagrees with the topic article, or whose date the
# articles cannot confirm (dataset vs article: the Postal Steamship Company founded 3 Dec 1872, Britain's Suez shares
# bought 24 Nov 1875, the Tokyo-Uraga-Tateyama steamers 24 Apr 1879, de Lesseps breaking ground at Panama 24 Feb 1881,
# the US canal concession 18 Nov 1901, the Kirishima Maru sinking 9 Mar 1927, Mitsubishi Heavy Industries 11 Feb 1931,
# the tanker Nissho Maru launched 10 Jul 1962, the Juliana spill 29 Nov 1971, the Diamond Princess deaths 20 Feb 2020
# and the Panama Canal Authority's transit cap 4 Sep 2026 / not dated in the articles; Kawasaki Dockyard founded
# 15 Oct 1896 / ja:川崎重工業 gives 9 Oct and ja:川崎造船所 15 Oct; the Sakura Maru emigrants landing at Ancon 3 Apr
# 1899 / the article has Callao; the Wakato ferry capsized 1 Apr 1930 / 2 Apr 1930; the Kongo Maru in service 6 Nov
# 1936 / 16 Nov 1936; Mitsui Senpaku founded 26 Dec 1942 / 28 Dec 1942; the Ehime Maru sunk 9 Feb 2001 / the article
# dates it 10 Feb 2001 in Japan time; the Wakashio leak reported 6 Aug 2020 / not dated in the article).
# Not used to keep the list within 40: the US taking over the Panama works 4 May 1904, the Lusitania 7 May 1915,
# the IHI merger Dec 1960, the naming of Asuka II 26 Feb 2006 and the Sanchi collision 6 Jan 2018.
slug: ship
title: 船と海運の歴史
lead: 1869年の観音埼燈台の初点灯とスエズ運河の開通、帆船カティーサークの進水から、日本郵船の創立、関釜連絡船と青函連絡船の運航開始、ブラジル移民を乗せた笠戸丸、タイタニック号の沈没、パナマ運河の開通、洞爺丸事故と紫雲丸事故、スエズ運河の国有化、堀江謙一の太平洋単独無寄港横断、日本初の長距離フェリーと原子力船「むつ」、青函連絡船の運航終了、セウォル号の沈没、スエズ運河の封鎖事故、世界最大の客船の出航まで。海上保安庁の設置やタイタニック号の残骸の発見、パナマ運河の返還も含めて、船と港と航路の歩みをたどる。
description: 観音埼燈台とスエズ運河の開通から、青函連絡船、タイタニック号の沈没、洞爺丸事故、堀江謙一の太平洋横断、スエズ運河の封鎖事故まで、船と海運の節目を日本と世界の出来事で年代順にたどる特集。
icon: art-suez-canal
