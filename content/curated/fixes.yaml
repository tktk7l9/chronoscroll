- id: 2020-01-01-3b336f20
  title: "2020年3月、mRNA（メッセンジャーRNA）の研究およびそれをワクチン開発に使うことを長年…"
  summary: "2020年3月、mRNA（メッセンジャーRNA）の研究およびそれをワクチン開発に使うことを長年研究していた研究者カタリン・カリコが所属するビオンテック社は、アメリカの製薬大手ファイザーとmRNAを用いた新型コロナウイルスワクチンの開発を開始すると発表し、臨床試験で95％という高い有効性を確認したとして世界を驚かせたあと、めざましい速さで開発および大量生産を実行し、共同開発の発表からわずか9か月後の2020年12月に一般の人へのワクチンの接種が開始され、世界で膨大な数の人々の命を救うことになった（カリコらはこの多大な功績が世界に認められ、2023年のノーベル賞を受賞することになる）。"

- id: 2020-01-01-de7249b5
  title: "新型コロナウイルス感染症（COVID-19）が世界的に流行 - 2019年11月ころに中国の武…"
  summary: "新型コロナウイルス感染症（COVID-19）が世界的に流行 - 2019年11月ころに中国の武漢市で正体不明の感染が発生したが、中国共産党による情報統制や情報隠蔽のせいもあり、当初世界各国の報道は気づいておらず、2020年1月初旬ころから数ヶ月のうちに世界中に広まってゆき、3月11日にWHO事務局長が「パンデミック（世界的流行）相当」と表明したことが世界中で報道されたものの、最初はウイルスの性質、感染力、感染経路、有効な感染防止法などが医師も含めて誰にもよく分からず、病院に入院する感染患者、コロナに感染してしまい亡くなる医師や医療関係者、病室に入り切らず廊下で対応される入院患者、感染患者を拒む病院などが世界中で続出し、世界各国が大パニックに陥った。感染拡大を抑えるため世界各国でロックダウンや入国制限などの措置、あるいは外出自粛の要請が実施され、各国で交通機関、運送会社、企業、飲食店、学校、教会、劇場 等々が深刻な機能停止状態になり、世界が機能停止状態に陥った。イタリアでは3月にコロナで亡くなった人が8,000名を超えて火葬が追いつかなくなり、遺体が入った棺桶が倉庫に並べられて放置される事態に陥り、アメリカニューヨーク市でも4月ころにはコロナによる死者が続出する状態になり、ロングアイランド湾に浮かぶ離島ハート島にある集団墓地に掘った穴に、遺体が入った棺桶を何段も積んで土で埋めてしまう悲惨な光景が世界中の報道で流れ、世界の人々はそれらの報道を見て、忍び寄るウイルス、自分の身に迫ってきている死への恐怖におののいた。"

