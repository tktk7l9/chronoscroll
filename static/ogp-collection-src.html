<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>特集OGP生成用（開発用・?slug=<slug> で描画）</title>
<style>
	* { margin: 0; box-sizing: border-box; }
	body {
		width: 1200px; height: 630px;
		background: #f7f5f0;
		font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
		color: #1f1c17;
		position: relative; overflow: hidden;
		padding: 74px 82px;
		display: flex; flex-direction: column;
	}
	/* 左端の背骨＝年表のガイド */
	.spine { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #b3541e; }
	.brand {
		display: flex; align-items: center; gap: 14px;
		font-family: "Hiragino Mincho ProN", serif; font-size: 30px; font-weight: 700; color: #6e675c;
	}
	.brand .tag {
		font-family: "Hiragino Kaku Gothic ProN", sans-serif;
		font-size: 20px; font-weight: 700; letter-spacing: 0.14em;
		color: #b3541e; border: 3px solid #b3541e; border-radius: 999px; padding: 3px 18px;
	}
	.body { display: flex; align-items: center; gap: 54px; margin-top: 40px; flex: 1; }
	.icon { flex: none; color: #b3541e; }
	.text { min-width: 0; }
	h1 {
		font-family: "Hiragino Mincho ProN", serif;
		font-size: 78px; line-height: 1.28; letter-spacing: 0.01em;
	}
	p.lead {
		font-size: 27px; margin-top: 26px; color: #443f37; line-height: 1.72;
		display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
	}
	.meta {
		display: flex; align-items: center; gap: 16px;
		font-size: 25px; color: #6e675c; font-weight: 600;
		border-top: 3px solid #d9d3c7; padding-top: 24px;
	}
	.meta .count { color: #1f1c17; font-size: 29px; font-weight: 700; }
	.meta .sep { color: #b5ad9d; }
	.meta .url { margin-left: auto; font-size: 23px; color: #8a8272; }
</style>
</head>
<body>
	<div class="spine"></div>
	<div class="brand">
		<span class="tag">特集</span>
		<span>chronoscroll</span>
	</div>
	<div class="body">
		<div class="icon"><svg id="icon" width="200" height="200" viewBox="0 0 96 96"></svg></div>
		<div class="text">
			<h1 id="title">—</h1>
			<p class="lead" id="lead"></p>
		</div>
	</div>
	<div class="meta">
		<span class="count" id="count"></span>
		<span class="sep">·</span>
		<span id="span"></span>
		<span class="url" id="url"></span>
	</div>
<script>
(async () => {
	const slug = new URLSearchParams(location.search).get('slug');
	const { collections } = await (await fetch('/data/collections.json')).json();
	const c = collections.find((x) => x.slug === slug);
	if (!c) { document.getElementById('title').textContent = 'not found: ' + slug; return; }
	document.getElementById('title').textContent = c.title;
	document.getElementById('lead').textContent = c.lead;
	document.getElementById('count').textContent = '全' + c.count + '件';
	document.getElementById('span').textContent = c.fromDate.slice(0, 4) + '年 〜 ' + c.toDate.slice(0, 4) + '年';
	document.getElementById('url').textContent = 'chronoscroll.vercel.app/c/' + c.slug;
	if (c.icon) {
		const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
		use.setAttribute('href', '/art/sprite.svg#' + c.icon);
		document.getElementById('icon').appendChild(use);
	}
	// 描画完了の合図（スクショ側が待つ）
	document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
